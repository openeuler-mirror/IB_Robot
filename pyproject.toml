[dependency-groups]
# pytest 7.x baseline: ROS Humble launch_testing plugins still use the old
# pytest_pycollect_makemodule(path, parent) hookspec removed in pytest 8.
test = [
    "pytest>=7.4,<8",
    "pytest-rerunfailures>=13,<15",
    "pytest-cov>=4,<7",
]

[tool.pytest.ini_options]
# Deliberately NO `testpaths` here. `colcon test` runs `python -m pytest` with no
# path argument and cwd set to the package source directory, so pytest walks up,
# finds this file as its rootdir config, and would apply `testpaths` INSTEAD of the
# package's own tests. Setting it here silently replaces every per-package suite
# with whatever this list names. Run repo-level tests by naming them explicitly:
#   pytest tests scripts .agents
# Everything under src/ is run by `colcon test`, never by a bare root pytest.
#
# `norecursedirs` is safe to set globally: it only prunes directories that do not
# exist inside a ROS package, and it stops a bare `pytest` at the workspace root
# from walking the LeRobot submodule, the model conversion work directories and
# any local virtualenv, which would collect thousands of third-party tests.
# The list restates pytest's defaults because assigning to this key replaces them.
# The autoloaded launch_testing plugin turns a module-level skip into a
# session-wide collection abort: one unimportable optional dependency makes the
# whole package report "collected 0 items" instead of skipping that one module.
# colcon treats pytest's no-tests-collected exit code as success, so the package
# would pass with zero tests run. No collected test needs this plugin - the
# launch smoke scripts under tests/ci_smoke/ are standalone and not named
# test_*.py - so switch it off rather than leave that trap armed.
addopts = "-p no:launch_testing -p no:launch_ros"

norecursedirs = [
    "*.egg",
    "*.egg-info",
    ".*",
    "_darcs",
    "build",
    "CVS",
    "dist",
    "node_modules",
    "venv",
    "{arch}",
    "install",
    "log",
    "libs",
    "third_party",
    "models",
    "src/pymoveit2",
    "src/rosclaw",
]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src"]

extend-exclude = [
    "build",
    "install",
    "log",
    "venv",
    "libs/lerobot",
    "src/pymoveit2",
    "src/rosclaw",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]
ignore = [
    "E501",
    "B008",
    "SIM108",
]

[tool.ruff.lint.isort]
known-first-party = [
    "aero_hand_hardware",
    "robot_config",
    "embodied_agent",
    "embodied_common",
    "embodied_bringup",
    "perception_service",
    "safety_guard",
    "skill_library",
    "robot_skill_cli",
    "action_dispatch",
    "inference_manifest",
    "inference_service",
    "dataset_tools",
    "robot_teleop",
    "robot_runtime",
    "so101_motion",
    "so101_robot",
    "so101_suite",
    "voice_asr_service",
    "voice_tts_service",
    "so101_hardware",
    "sim_models",
    "tensormsg",
    "torch_models",
    "model_utils",
    "ibrobot_msgs",
    "semantic_mapping",
    "robot_calibration",
    "benchmark_runtime",
    "benchmark_libero",
    "ibrobot_tracing",
    "ibrobot_tracing_web",
]

[tool.ruff.format]
quote-style = "double"
