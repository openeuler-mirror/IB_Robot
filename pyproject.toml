[dependency-groups]
# pytest 7.x baseline: ROS Humble launch_testing plugins still use the old
# pytest_pycollect_makemodule(path, parent) hookspec removed in pytest 8.
test = [
    "pytest>=7.4,<8",
    "pytest-rerunfailures>=13,<15",
    "pytest-cov>=4,<7",
]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src"]

extend-exclude = [
    "build",
    "install",
    "log",
    "venv",
    "libs/lerobot",
    "src/pymoveit2",
    "src/rosclaw",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]
ignore = [
    "E501",
    "B008",
    "SIM108",
]

[tool.ruff.lint.isort]
known-first-party = [
    "aero_hand_hardware",
    "robot_config",
    "embodied_agent",
    "embodied_common",
    "embodied_bringup",
    "perception_service",
    "safety_guard",
    "skill_library",
    "robot_skill_cli",
    "action_dispatch",
    "inference_manifest",
    "inference_service",
    "dataset_tools",
    "robot_teleop",
    "robot_runtime",
    "so101_motion",
    "so101_robot",
    "so101_suite",
    "voice_asr_service",
    "voice_tts_service",
    "so101_hardware",
    "sim_models",
    "tensormsg",
    "torch_models",
    "model_utils",
    "ibrobot_msgs",
    "semantic_mapping",
    "robot_calibration",
    "benchmark_runtime",
    "benchmark_libero",
    "ibrobot_tracing",
    "ibrobot_tracing_web",
]

[tool.ruff.format]
quote-style = "double"
