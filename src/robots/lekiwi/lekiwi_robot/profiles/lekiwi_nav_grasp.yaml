# LeKiwi runtime profile (lekiwi_nav_grasp): navigation + grasp with 1 isolated IK worker.

runtime:
  name: lekiwi_robot
  version: 0.1.0

use_sim: false
controller_manager: controller_manager
joint_state_topic: /joint_states
joints: ["1", "2", "3", "4", "5", "6", "7", "8", "9"]
arm_joints: ["1", "2", "3", "4", "5"]

description:
  xacro: $(find lekiwi_description)/urdf/lekiwi_assembled.urdf.xacro
  xacro_args:
    use_sim: "false"

hardware:
  port: /dev/ttyACM0
  calib_file: $(env HOME)/.calibrate/so101_follower_calibrate.json
  reset_positions:
    "1": 0.0
    "2": -1.5854
    "3": 1.5708
    "4": 0.7854
    "5": 0.0

ros2_control:
  controllers_config: $(find lekiwi_hardware)/config/lekiwi_controllers.yaml
  broadcasters: [joint_state_broadcaster, arm_joint_state_broadcaster]
  hardware_components: [RobotSystem]

modes:
  initial: idle
  idle:
    controllers: []
    transitions: [stream, trajectory, base_navigation]
  stream:
    controllers: [arm_position_controller, gripper_position_controller]
    allows_stream: true
    transitions: [idle, trajectory]
  trajectory:
    controllers: [arm_trajectory_controller, gripper_trajectory_controller]
    allows_trajectory: true
    transitions: [idle, stream, base_navigation]
  base_navigation:
    controllers: [base_velocity_controller]
    allows_base: true
    transitions: [idle, trajectory]

command_channels:
  - channel: arm_stream
    topic: /arm_position_controller/commands
    joints: ["1", "2", "3", "4", "5"]
    modes: [stream]
  - channel: gripper_stream
    topic: /gripper_position_controller/commands
    joints: ["6"]
    modes: [stream]
  - channel: base_cmd_vel
    topic: /cmd_vel
    type: twist
    modes: [base_navigation]
    navigation_gated: true

trajectory_actions:
  - /arm_trajectory_controller/follow_joint_trajectory
  - /gripper_trajectory_controller/follow_joint_trajectory

motion:
  arm_group_name: arm
  base_link: base
  ee_link: gripper
  shoulder_link: shoulder
  # MoveIt plans for the SO-101 arm alone: its model is the SO-101 arm URDF
  # (matching so101_motion's SRDF), rendered with this profile's hardware
  # arguments, and it consumes the arm-only broadcaster. Without an explicit
  # model move_group falls back to /robot_description -- the whole LeKiwi with
  # wheels it never receives state for -- and FK/IK/planning all fail.
  model_xacro: $(find so101_description)/urdf/lerobot/so101/so101.urdf.xacro
  joint_state_topic: /arm_joint_state_broadcaster/joint_states
  ik_worker_count: 1
  motion_feedback_timeout_s: 0.3
  motion_feedback_tolerance_rad: 0.12
  motion_require_tf_sync: true
  # Empty on purpose: LeKiwiSystemHardware publishes no joint-current heartbeat
  # (only So101SystemHardware publishes /so101_follower/joint_currents). A
  # non-empty topic makes the motion server's post-motion barrier wait for a
  # heartbeat that never arrives, so every physical MoveToPose /
  # MoveToConfiguration would time out and report EXECUTION_FAILED. LeKiwi read
  # failures already surface as controller errors; no separate heartbeat is
  # needed.
  motion_hardware_feedback_topic: ""

base:
  wheel_joints: ["7", "8", "9"]
  wheel_radius: 0.05
  base_radius: 0.125
  max_wheel_radps: 4.602
  control_frequency: 50.0
  odom_frame: odom
  base_frame: base_link
  publish_tf: true
  navigation_enabled_on_startup: false

capabilities:
  joint.state: {joint_count: 9, rate_hz: 100.0}
  joint.position_stream: {joint_count: 6, rate_hz: 100.0}
  joint.trajectory: {joint_count: 6}
  gripper.1d: {count: 1}
  motion.fk: {ee_link: gripper, endpoints: ['/motion/compute_fk', '/ik_worker_0/motion/compute_fk']}
  motion.ik: {endpoints: ['/motion/compute_ik', '/ik_worker_0/motion/compute_ik']}
  motion.move_to_joint: {}
  motion.move_to_pose: {}
  # Linear limits are what the wheels can realize: max_wheel_radps x
  # wheel_radius over each axis' largest wheel projection (0.2657 / 0.2301 m/s,
  # checked at launch by lekiwi_robot.base_profile).
  base.cmd_vel: {max_vx: 0.26, max_vy: 0.23, max_wz: 1.5, staleness_s: 0.5}
  base.odom: {}
  base.navigation_gate: {}
  runtime.stop: {cancel_bound_s: 1.0, idle_bound_s: 3.0, torque_off_bound_s: 5.0}

# D12: the robot's default sensor surface. Deployment robot YAMLs override
# entries by (type, name) via the runtime `peripherals` launch argument.
peripherals:
- type: microphone
  name: respeaker
  driver: alsa
  params:
    device: hw:0,0
    channels: 6
    sample_rate: 16000
    sample_format: S16LE
    channel_indices:
    - 1
    - 2
    - 3
    - 4
- # The playback device the runtime can launch when a deployment enables it
  # (runtime-peripheral-overrides: the profile owns the driver and defaults;
  # a robot configuration opts in with an enabled-true override entry).
  type: speaker
  name: speaker
  driver: alsa
  enabled: false
  params:
    device: ""
    channels: 1
    sample_rate: 24000
    sample_format: S16LE
- type: camera
  name: wrist
  driver: realsense
  serial_number: ''
  initial_reset: false
  width: 640
  height: 360
  fps: 30
  pixel_format: bgr8
  align_depth: true
  enable_sync: false
  enable_pointcloud: false
  enable_gyro: false
  enable_accel: false
  streams:
  - color
  - depth
  frame_id: camera_wrist_link
  optical_frame_id: camera_wrist_optical_frame
  transform:
    parent_frame: gripper
    x: -0.029804122099556248
    y: 0.0735813073058911
    z: -0.03849247926512127
    roll: 3.093836835932143
    pitch: 1.0039505938496505
    yaw: -1.6776874824436123
- type: camera
  name: front
  driver: realsense
  driver_camera_name: front
  serial_number: ''
  width: 640
  height: 480
  fps: 30
  color_format: RGB8
  depth_format: Z16
  streams:
  - color
  - depth
  align_depth: true
  enable_sync: true
  initial_reset: false
  enable_pointcloud: false
  frame_id: camera_front_link
  optical_frame_id: camera_front_optical_frame
  skip_urdf_without_transform: true
  transform:
    parent_frame: base_link
    x: 0.0
    y: 0.0
    z: 0.0
    roll: 0.0
    pitch: 0.0
    yaw: 0.0
- type: lidar
  name: mid360
  driver: livox_mid360
  frame_id: livox_frame
  lidar_ip: 192.168.1.139
  host_ip: 192.168.1.5
  pointcloud_topic: /livox/lidar
  imu_topic: /livox/imu
  user_config_path: $(find livox_ros_driver2)/config/MID360_config.json
  xfer_format: 1
  multi_topic: 0
  data_src: 0
  publish_freq: 10.0
  output_data_type: 0
  cmdline_input_bd_code: livox0000000001
  respawn: true
  scan_converter:
    enabled: true
    queue_size: 1
    pointcloud_topic: /cloud_registered_body
    scan_topic: /scan
    target_frame: body
    transform_tolerance: 0.01
    min_height: -0.05
    max_height: 0.5
    angle_min: -3.14159265
    angle_max: 3.14159265
    angle_increment: 0.00872665
    scan_time: 0.1
    range_min: 0.1
    range_max: 8.0
    use_inf: true
    inf_epsilon: 1.0
    respawn: true

# D12: lidar odometry chain defaults (lekiwi runtime composes fastlio_mapping
# plus the odom bridge; deployment overrides merge on top).
fast_lio:
  enabled: false
  params_file: $(find lekiwi_robot)/config/fast_lio_mid360.yaml
  lidar_topic: /livox/lidar
  imu_topic: /livox/imu
  raw_odom_topic: /fast_lio/odometry_raw
  output_topic: /odometry/filtered
  source_odom_frame: camera_init
  source_body_frame: body
  odom_frame: odom
  base_frame: base_link
  publish_tf: true
  planar_output: false
  max_future_skew_sec: 0.1
  respawn: true
