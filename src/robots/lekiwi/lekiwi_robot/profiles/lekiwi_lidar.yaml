# LeKiwi runtime profile (lekiwi_lidar): omni-wheel base only, MID-360 localization.
#
# This is the minimal wheeled surface: no arm, no gripper, no motion services.
# lekiwi_hardware drives only the three wheel servos (base_only_mode_, IDs 7-9
# in wheel/velocity mode), so the arm servos are never opened or configured.
#
# It deliberately differs from the integration prototype's same-named profile,
# which declared all nine joints ("SO-101 arm + omni-wheel base"). The migrated
# application configuration lekiwi_lidar.yaml is base-only, and a profile that
# quietly brought the arm along would claim hardware the deployment does not
# have.

runtime:
  name: lekiwi_robot
  version: 0.1.0

use_sim: false
sim_platforms: [sdk, gazebo, mujoco]
sim_platform: sdk
# The single source of the lidar pose (D13): the profile's transform defaults
# below are derived from this mount; the application path (sensor_mount) keeps
# them consistent through the deployment fragment.
mid360_mount_file: $(find lekiwi_description)/config/lekiwi_mid360_mount.yaml

# MuJoCo runtime platform (lekiwi-mujoco-runtime-platform D1): the robot MJCF
# template and its (decimated, D2b) mesh directory, and the floating-base
# drive (D3). No joint_current block: this profile advertises no joint.current
# interface, so the runtime's simulated joint-current publisher stays off.
simulation:
  mujoco:
    template: $(find lekiwi_description)/mujoco/lekiwi_base.xml.template
    meshes_dir: $(find lekiwi_description)/meshes/mujoco
    sdf_meshes: []
    floating_base:
      # the MJCF body with the free joint the BaseVelocityPlugin drives; also
      # the URDF root frame and the relay's validated odometry child frame
      body: base_link
      # the base's own wheel odometry (D3): the relay forwards the twist it
      # reports to the simulator-internal floating-base command topic
      twist_source_topic: /odom

controller_manager: controller_manager
joint_state_topic: /joint_states
joints: ["7", "8", "9"]

description:
  xacro: $(find lekiwi_description)/urdf/lekiwi_assembled.urdf.xacro
  xacro_args:
    use_sim: "false"
    base_only: "true"

hardware:
  port: /dev/ttyACM0
  # Wheel servos run in continuous-rotation mode: no homing offset and no joint
  # limits, so there is no calibration file and no reset pose to restore.

ros2_control:
  controllers_config: $(find lekiwi_hardware)/config/lekiwi_base_controllers.yaml
  broadcasters: [joint_state_broadcaster]
  hardware_components: [RobotSystem]

modes:
  initial: idle
  idle:
    controllers: []
    # MuJoCo platform override (D3.1): a released MuJoCo velocity actuator
    # keeps its last target, so the base controller is NEVER deactivated
    # there — it stays active in idle and base_node is the gate (its zero on
    # a non-base mode, stop latch, closed gate or stale /cmd_vel).
    controllers_by_platform:
      mujoco: [base_velocity_controller]
    transitions: [base_navigation]
  base_navigation:
    controllers: [base_velocity_controller]
    allows_base: true
    transitions: [idle]

command_channels:
  - channel: base_cmd_vel
    topic: /cmd_vel
    type: twist
    modes: [base_navigation]
    navigation_gated: true

base:
  wheel_joints: ["7", "8", "9"]
  wheel_radius: 0.05
  base_radius: 0.125
  max_wheel_radps: 4.602
  control_frequency: 50.0
  odom_frame: odom
  base_frame: base_link
  publish_tf: true
  navigation_enabled_on_startup: false

capabilities:
  joint.state: {joint_count: 3, rate_hz: 100.0}
  # Linear limits are what the wheels can realize: max_wheel_radps x
  # wheel_radius over each axis' largest wheel projection (0.2657 / 0.2301 m/s,
  # checked at launch by lekiwi_robot.base_profile).
  base.cmd_vel: {max_vx: 0.26, max_vy: 0.23, max_wz: 1.5, staleness_s: 0.5}
  base.odom: {}
  base.navigation_gate: {}
  runtime.stop: {cancel_bound_s: 1.0, idle_bound_s: 3.0, torque_off_bound_s: 5.0}

# D12: the robot's default sensor surface. Deployment robot YAMLs override
# entries by (type, name) via the runtime `peripherals` launch argument.
peripherals:
- type: lidar
  name: mid360
  driver: livox_mid360
  frame_id: livox_frame
  lidar_ip: 192.168.1.139
  host_ip: 192.168.1.5
  pointcloud_topic: /livox/lidar
  imu_topic: /livox/imu
  user_config_path: $(find livox_ros_driver2)/config/MID360_config.json
  xfer_format: 1
  multi_topic: 0
  data_src: 0
  publish_freq: 10.0
  output_data_type: 0
  cmdline_input_bd_code: livox0000000001
  respawn: true
  # D13: the public static TF of livox_frame and (below) the simulator
  # attachment pose both default to the mount relative to base_link
  # (lekiwi_mid360_mount.yaml: translation_m [-0.08, 0.0, 0.20],
  # rpy_deg [0.0, 0.0, 90.0]). The application path replaces both through
  # the deployment fragment: transform becomes the body -> livox_frame
  # identity while the simulator pose stays the base_link-relative mount.
  transform:
    parent_frame: base_link
    x: -0.08
    y: 0.0
    z: 0.2
    roll: 0.0
    pitch: 0.0
    yaw: 1.5707963267948966
  simulation:
    gazebo:
      transform:
        parent_frame: base_link
        x: -0.08
        y: 0.0
        z: 0.2
        roll: 0.0
        pitch: 0.0
        yaw: 1.5707963267948966
      # Simulated MID-360 sensor parameters (D1 starting values, tunable).
      horizontal_samples: 900
      vertical_samples: 32
      vertical_min_deg: -7.0
      vertical_max_deg: 52.0
      range_min: 0.1
      range_max: 40.0
      update_rate: 10.0
      # The MID-360's built-in IMU.
      imu:
        update_rate: 200.0
    # MuJoCo platform parameters (lekiwi-mujoco-runtime-platform D1): the
    # same mount pose; a coarser horizontal grid than Gazebo's (CPU ray
    # casting), raisable if the real-time-factor target holds. No IMU rate
    # key: the simulated IMU publishes on the controller-manager clock, so
    # the advertised rate derives from the effective update_rate (D5.3).
    mujoco:
      transform:
        parent_frame: base_link
        x: -0.08
        y: 0.0
        z: 0.2
        roll: 0.0
        pitch: 0.0
        yaw: 1.5707963267948966
      horizontal_samples: 360
      vertical_samples: 32
      vertical_min_deg: -7.0
      vertical_max_deg: 52.0
      range_min: 0.1
      range_max: 40.0
      update_rate: 10.0
  scan_converter:
    enabled: true
    queue_size: 1
    pointcloud_topic: /cloud_registered_body
    scan_topic: /scan
    target_frame: body
    transform_tolerance: 0.01
    min_height: -0.05
    max_height: 0.5
    angle_min: -3.14159265
    angle_max: 3.14159265
    angle_increment: 0.00872665
    scan_time: 0.1
    range_min: 0.1
    range_max: 8.0
    use_inf: true
    inf_epsilon: 1.0
    respawn: true
- # The fixed front RealSense the sensor-calibration deployment enables
  # (runtime-peripheral-overrides: the profile owns the driver and defaults
  # to disabled; a robot configuration opts in with an enabled-true override
  # entry, the same pattern as the speaker on lekiwi_nav_grasp).
  type: camera
  name: front
  driver: realsense
  enabled: false
  driver_camera_name: front
  serial_number: ''
  width: 640
  height: 480
  fps: 30
  color_format: RGB8
  depth_format: Z16
  streams:
  - color
  - depth
  align_depth: false
  enable_sync: false
  initial_reset: false
  enable_pointcloud: false
  frame_id: camera_front_link
  optical_frame_id: camera_front_optical_frame
  skip_urdf_without_transform: true
  transform:
    parent_frame: base_link
    x: 0.0
    y: 0.0
    z: 0.0
    roll: 0.0
    pitch: 0.0
    yaw: 0.0

# D12: lidar odometry chain defaults (lekiwi runtime composes fastlio_mapping
# plus the odom bridge; deployment overrides merge on top). sim_params_file
# is the simulation parameter set the physics platforms launch with (D6);
# the hardware file stays params_file.
fast_lio:
  enabled: false
  params_file: $(find lekiwi_robot)/config/fast_lio_mid360.yaml
  sim_params_file: $(find lekiwi_robot)/config/fast_lio_mid360_sim.yaml
  lidar_topic: /livox/lidar
  imu_topic: /livox/imu
  raw_odom_topic: /fast_lio/odometry_raw
  output_topic: /odometry/filtered
  source_odom_frame: camera_init
  source_body_frame: body
  odom_frame: odom
  base_frame: base_link
  # The bridge's body-to-base extrinsic = the inverse of the MID-360 mount
  # (lekiwi_description/config/lekiwi_mid360_mount.yaml: -0.08, 0, 0.2 m,
  # +90 deg yaw). The provider path has no application mount loader to derive
  # it, so the profile carries the mount-derived default (D13).
  body_to_base_translation: [0.0, -0.08, -0.2]
  body_to_base_rotation: [0.0, 0.0, -0.7071067811865476, 0.7071067811865476]
  publish_tf: true
  planar_output: false
  max_future_skew_sec: 0.1
  respawn: true
