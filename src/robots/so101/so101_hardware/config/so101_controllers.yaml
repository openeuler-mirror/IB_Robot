controller_manager:
  ros__parameters:
    update_rate: 100 # Hz

    # 位置控制器（用于ACT等高频模式）
    arm_position_controller:
      type: position_controllers/JointGroupPositionController

    gripper_position_controller:
      type: forward_command_controller/ForwardCommandController

    # 轨迹控制器（用于MoveIt规划模式）
    arm_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # 状态广播器（共用）
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

joint_state_broadcaster:
  ros__parameters:
    # NOTE: this list only selects WHICH state interfaces are claimed.
    # It does NOT control the /joint_states publishing order: the Humble
    # joint_state_broadcaster builds joint_names_ by iterating an
    # unordered_map (init_joint_data), so the message order is a hash-bucket
    # order (e.g. 2,4,1,3,5,6) and is unspecified by design. Every consumer
    # must resolve joints by msg.name; the ordered joint list for datasets
    # and commands is the public description's joint.state joint_names.
    joints:
      - "1"
      - "2"
      - "3"
      - "4"
      - "5"
      - "6"

# 位置控制器配置
arm_position_controller:
  ros__parameters:
    joints:
      - "1"
      - "2"
      - "3"
      - "4"
      - "5"

    command_interfaces:
      - position

    state_interfaces:
      - position

gripper_position_controller:
  ros__parameters:
    joints:
      - "6"
    interface_name: position

# 轨迹控制器配置
arm_trajectory_controller:
  ros__parameters:
    joints:
      - "1"
      - "2"
      - "3"
      - "4"
      - "5"

    command_interfaces:
      - position

    state_interfaces:
      - position

    allow_integration_in_goal_trajectories: true
    allow_nonzero_velocity_at_trajectory_end: true

gripper_trajectory_controller:
  ros__parameters:
    joints:
      - "6"

    command_interfaces:
      - position

    state_interfaces:
      - position

    allow_integration_in_goal_trajectories: true
    allow_nonzero_velocity_at_trajectory_end: true
