controller_manager:
  ros__parameters:
    update_rate: 100  # Hz (与单臂标准一致)

    # 位置控制器（用于ACT/teleop等高频模式）
    arm_position_controller_left:
      type: position_controllers/JointGroupPositionController
    gripper_position_controller_left:
      type: forward_command_controller/ForwardCommandController

    arm_position_controller_right:
      type: position_controllers/JointGroupPositionController
    gripper_position_controller_right:
      type: forward_command_controller/ForwardCommandController

    # 轨迹控制器（用于MoveIt规划模式）
    arm_trajectory_controller_left:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_trajectory_controller_left:
      type: joint_trajectory_controller/JointTrajectoryController

    arm_trajectory_controller_right:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_trajectory_controller_right:
      type: joint_trajectory_controller/JointTrajectoryController

    # 状态广播器（共用）
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

# =======================================================
# 广播器配置 (Global)
# =======================================================
joint_state_broadcaster:
  ros__parameters:
    joints:
      - joint1_left
      - joint2_left
      - joint3_left
      - joint4_left
      - joint5_left
      - joint6_left
      - joint1_right
      - joint2_right
      - joint3_right
      - joint4_right
      - joint5_right
      - joint6_right

# =======================================================
# 左臂控制器配置
# =======================================================
# 位置控制器配置
arm_position_controller_left:
  ros__parameters:
    joints:
      - joint1_left
      - joint2_left
      - joint3_left
      - joint4_left
      - joint5_left
    command_interfaces:
      - position
    state_interfaces:
      - position

gripper_position_controller_left:
  ros__parameters:
    joints:
      - joint6_left
    interface_name: position

# 轨迹控制器配置
arm_trajectory_controller_left:
  ros__parameters:
    joints:
      - joint1_left
      - joint2_left
      - joint3_left
      - joint4_left
      - joint5_left
    command_interfaces:
      - position
    state_interfaces:
      - position
    allow_integration_in_goal_trajectories: true
    allow_nonzero_velocity_at_trajectory_end: true

gripper_trajectory_controller_left:
  ros__parameters:
    joints:
      - joint6_left
    command_interfaces:
      - position
    state_interfaces:
      - position
    allow_integration_in_goal_trajectories: true
    allow_nonzero_velocity_at_trajectory_end: true

# =======================================================
# 右臂控制器配置
# =======================================================
arm_position_controller_right:
  ros__parameters:
    joints:
      - joint1_right
      - joint2_right
      - joint3_right
      - joint4_right
      - joint5_right
    command_interfaces:
      - position
    state_interfaces:
      - position

gripper_position_controller_right:
  ros__parameters:
    joints:
      - joint6_right
    interface_name: position

arm_trajectory_controller_right:
  ros__parameters:
    joints:
      - joint1_right
      - joint2_right
      - joint3_right
      - joint4_right
      - joint5_right
    command_interfaces:
      - position
    state_interfaces:
      - position
    allow_integration_in_goal_trajectories: true
    allow_nonzero_velocity_at_trajectory_end: true

gripper_trajectory_controller_right:
  ros__parameters:
    joints:
      - joint6_right
    command_interfaces:
      - position
    state_interfaces:
      - position
    allow_integration_in_goal_trajectories: true
    allow_nonzero_velocity_at_trajectory_end: true
