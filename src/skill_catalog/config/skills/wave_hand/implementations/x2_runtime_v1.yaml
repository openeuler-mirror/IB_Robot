schema_version: 1
kind: delegated_executor
robot: x2_runtime_v1
executor: runtime_named_motion
binding:
  # Runtime motion name advertised by the aimdk_robot profile (motion.named.names).
  motion: wave
required_args: []
# Above the runtime's own preset_timeout_s (30 s) so the runtime reports first.
timeout_sec: 45.0
