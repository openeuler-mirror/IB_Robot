# Navigation simulation overlay on the migrated LeKiwi lidar configuration
# (openspec lekiwi-gazebo-runtime-platform D10).
#
# base_config selects the shipped production lekiwi_lidar.yaml; every
# override below sits INSIDE nav_stages.navigation, so the stage merge (which
# happens after the base/overlay merge) applies them to the production
# navigation stage: the Gazebo platform with the nav_room scene and its spawn
# pose, the simulation map and Nav2 parameters (AMCL starts at the spawn pose
# and broadcasts the single map -> odom), deterministic localisation, and no
# voice/embodied/RViz surfaces. FAST-LIO, the scan converter, the collision
# monitor and the navigation admission stay exactly as in production — the
# loader resolves sibling bases only, so tests stage this overlay next to the
# shipped configuration (the staging helper does that).
robot:
  base_config: lekiwi_lidar

  nav_stages:
    navigation:
      simulation:
        platform: gazebo
        scene: nav_room
        robot_spawn:
          x: -1.5
          y: -1.5
          z: 0.05
          yaw: 0.0

      navigation:
        nav2_bringup:
          map_file: $(find robot_navigation)/config/maps/sim_map.yaml
          params_file: $(find robot_navigation)/config/nav2_params_sim.yaml
          auto_global_localization: false

      voice_asr:
        enabled: false

      embodied:
        enabled: false

      rviz:
        enabled: false
