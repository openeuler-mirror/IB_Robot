# Minimal generic-behaviour fixture (lekiwi-gazebo-runtime-platform D11).
#
# Retiring `config/robots/lekiwi.yaml` must not retire the generic behaviours
# it happened to cover: the sim_controllers override (simulation drops the
# hardware-only imu_sensor_broadcaster) and the launch loader's config-path
# preservation for runtime consumers. This fixture references no retired
# LeKiwi asset; it is deliberately minimal.

robot:
  name: sim_controllers_fixture
  type: test_robot
  robot_type: test_robot

  joints:
    drive:
      - left_wheel_joint
    all:
      - left_wheel_joint

  default_control_mode: teleop

  control_modes:
    teleop:
      description: "Sim-controller override fixture mode"
      controllers:
        - joint_state_broadcaster
        - imu_sensor_broadcaster
        - base_controller
      sim_controllers:
        - joint_state_broadcaster
        - base_controller

  ros2_control:
    hardware_plugin: test_hardware/TestSystem
    urdf_path: $(find robot_config)/test/config/minimal_sim_controllers.urdf.xacro
    controllers_config: $(find robot_config)/test/config/minimal_sim_controllers.yaml
    controllers:
      - joint_state_broadcaster
      - imu_sensor_broadcaster
      - base_controller

  peripherals:
    - type: camera
      name: front
      driver: camera_ros
      index: 0
      format: MJPEG
      width: 640
      height: 480
      fps: 15
      frame_id: camera
      simulation:
        embedded_sensor: true

    - type: lidar
      name: laser
      driver: ldlidar
      frame_id: laser_frame
      port: /dev/ttyLIDAR
      params:
        product_name: LDLiDAR_LD19
        laser_scan_topic_name: scan
        point_cloud_2d_topic_name: ""
        frame_id: laser_frame
        serial_baudrate: 230400
        laser_scan_dir: true
        enable_angle_crop_func: false
        angle_crop_min: 135.0
        angle_crop_max: 225.0
        range_min: 0.02
        range_max: 12.0

  # the recording-topics composition: contract observations/actions plus the
  # peripherals feed the recording set (dataset_tools' migrated test)
  contract:
    rate_hz: 20
    max_duration_s: 90.0

    observations:
      - key: observation.images.front
        topic: /camera/front/image_raw
        type: sensor_msgs/msg/Image
        peripheral: front
        image:
          resize: [480, 640]
        align:
          strategy: hold
          stamp: header
          tol_ms: 500
        qos:
          reliability: best_effort
          history: keep_last
          depth: 10

      - key: observation.state
        topic: /base_controller/odom
        type: nav_msgs/msg/Odometry
        selector:
          names:
            - pose.pose.position.x
            - pose.pose.position.y
            - pose.pose.orientation.z
            - pose.pose.orientation.w
            - twist.twist.linear.x
            - twist.twist.linear.y
            - twist.twist.angular.z
        align:
          strategy: hold
          stamp: header
          tol_ms: 200
        qos:
          reliability: best_effort
          history: keep_last
          depth: 20

    actions:
      - key: action
        publish:
          topic: /base_controller/cmd_vel
          type: geometry_msgs/msg/TwistStamped
          qos:
            reliability: best_effort
            history: keep_last
            depth: 10
          strategy:
            mode: nearest
            tolerance_ms: 200
        selector:
          names:
            - twist.linear.x
            - twist.linear.y
            - twist.angular.z
        from_tensor:
          clamp: [-1.0, 1.0]
        safety_behavior: zeros

  # teleoperation contributes runtime-gated Node actions: the launch
  # extension test releases them behind the controller-readiness barrier
  teleoperation:
    enabled: true
    active_device: fixture_gamepad
    devices:
      - name: fixture_gamepad
        type: joy_teleop
        config_path: $(find robot_config)/config/lekiwi/lekiwi_teleop.yaml
        input_device: /dev/input/js0
        deadzone: 0.1
        autorepeat_rate: 20.0
