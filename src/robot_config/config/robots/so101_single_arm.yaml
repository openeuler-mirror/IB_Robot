# SO-101 single-arm application configuration (so101-runtime-migration).
#
# Runtime ownership: hardware ports, calibration, controller sets, motion
# assets and physical cameras live in the so101_robot runtime profile
# (so101_robot/profiles/so101_single_arm.yaml). This file selects that
# runtime and binds the application contract to its public interfaces.
# Operator input devices are declared in the runtime-owned input config
# referenced by teleoperation.input_config.

robot:
  name: so101_single_arm
  type: so101
  robot_type: so_101  # For LeRobot dataset metadata

  # Robot runtime provider (robot-runtime-packaging). simulation.platform=sdk
  # selects the SDK simulated transport; Gazebo/MuJoCo/mock are not supported
  # on the provider path.
  simulation:
    platform: sdk

  runtime:
    provider: so101_robot
    profile: so101_single_arm
    # The bound snapshot must carry the public model (groups/limits/frames/
    # conversions); inference, recording and teleop consume it instead of
    # private calibration files.
    require_model: true

  capabilities:
    requires:
      - joint.state
      - joint.position_stream
      - joint.trajectory
      - gripper.1d
      - motion.fk
      - motion.ik
      - motion.move_to_joint
      - motion.move_to_pose
      - runtime.stop

  # Public-interface bindings for task execution (no controller-name guessing).
  task_dispatch:
    gripper_trajectory_interface: joint.trajectory_gripper

  # Control mode management. Controller activation sets are runtime-owned;
  # each mode selects the runtime mode it admits.
  default_control_mode: "model_inference"
  skill_required_control_mode: "moveit_planning"
  controller_startup_timeout:
    sim: 120.0
    hardware: 30.0

  control_modes:
    teleop:
      description: "Human teleoperation mode (direct control)"
      description_cn: "人工遥操作模式（直接控制）"
      # Teleop starts idle; the operator explicitly arms streaming.
      runtime_mode: stream
      inference:
        enabled: false
      executor:
        type: topic
        mode: teleop
        queue_size: 100
        control_frequency: 50.0

    model_inference:
      description: "High-frequency end-to-end control mode (ACT/pi0)"
      description_cn: "高频端到端控制模式（ACT/pi0）"
      # Policy owns a dedicated stream mode; it must admit from idle and
      # never share the teleop stream mode.
      runtime_mode: policy_stream
      inference:
        enabled: true
        pipelines:
          policy:
            model_path: models/ACT_1arm_2cam_banana_pick_v1_step_160000_distill_20260515
            deployment: cpu
            execution_mode: monolithic
            request_timeout: 120.0
            default_task: "pick up the banana"
      executor:
        type: topic
        mode: model_inference
        inference_pipeline: policy
        queue_size: 100
        # Keep about 2.5s of buffered actions so ~1.5s distributed RKNN latency
        # still leaves margin before the dispatcher falls back to hold.
        watermark_threshold: 50
        control_frequency: 20.0

    moveit_planning:
      description: "MoveIt trajectory planning mode (VoxPoser/VLM)"
      description_cn: "MoveIt轨迹规划模式（VoxPoser/VLM）"
      runtime_mode: trajectory
      inference:
        enabled: false
      executor:
        type: topic
        mode: moveit_planning

  # Voice ASR is configured here and injected by robot_config/robot.launch.py.
  voice_asr:
    enabled: false
    active_mode: continuous
    language: zh
    bundle_path: "models/voice_asr/sherpa-onnx-streaming-zipformer-zh-14M-2023-02-23"
    deployment: torch_cpu
    max_recording_duration: 10.0
    vad_sensitivity: 0.6
    realtime_pre_roll_seconds: 0.5
    publish_partial: true
    sample_rate: 16000
    chunk_size: 512
    buffer_seconds: 5.0
    output_topic: /voice_command
    exit_on_init_failure: true

  audio_io:
    enabled: true
    playback_topic: /audio/play
    playback_device: ""
    playback_sample_rate: 24000
    playback_channels: 1
    playback_sample_format: S16LE

  voice_tts:
    enabled: true
    bundle_path: "models/zipvoice"
    deployment: "ubuntu_onnx"
    service_name: /voice_tts/synthesize
    playback_service_name: /voice_tts/play
    playback_timeout_sec: 300.0
    synthesis_timeout_sec: 90.0
    prompt_profile: default
    segment_max_chars: 200
    segment_pause_ms: 150
    max_request_chars: 4000
    max_prompt_audio_bytes: 10485760
    max_prompt_duration_sec: 30.0
    max_segments: 32
    max_response_audio_bytes: 67108864
    tts_timeout_sec: 15.0
    device_id: 0
    exit_on_init_failure: false

  semantic_mapping:
    enabled: false

  embodied:
    enabled: false
    entry_mode: hermes
    skill_catalog_source_mode: development
    skill_catalog_source_root: src/skill_catalog
    skill_catalog_profile: so101_single_arm
    debug_tracing: true
    task_input_topic: /voice_command
    task_command_topic: /embodied/task_command
    planned_task_topic: /embodied/planned_task
    status_topic: /embodied/task_status
    skill_action_name: /embodied/execute_skill
    primitive_action_name: /embodied/execute_primitive
    validate_skill_service: /embodied/validate_skill
    validate_primitive_service: /embodied/validate_primitive
    skill_gateway_status_service: /embodied/get_skill_gateway_status
    start_visual_game_service: /embodied/start_visual_game
    get_visual_game_result_service: /embodied/get_visual_game_result
    visual_game_event_topic: /embodied/visual_game_events
    visual_game_result_capacity: 128
    default_target_name: demo_object
    default_place_name: home
    timeouts:
      task_budget_sec: 180.0
      default_skill_timeout_sec: 120.0
      robot_state_freshness_sec: 0.5
      scene_freshness_sec: 0.5
      model_idle_timeout_sec: 120.0
      visual_game_timeout_sec: 130.0
      visual_game_result_retention_sec: 300.0
      rpc_timeout_sec: 5.0
      gripper_settle_sec: 1.5
    perception:
      enabled: false
      request_topic: /embodied/perception_request
      text_input_topic: /embodied/perception_text
      result_topic: /embodied/perception_result
      summary_topic: /embodied/perception_summary
      default_session_id: default
      scene_sources:
        primary_camera_topic: /camera/front/image_raw
        primary_camera_info_topic: /camera/front/camera_info
        primary_aligned_depth_topic: /camera/front/aligned_depth_to_color/image_raw
        primary_pointcloud_topic: ""
        wrist_camera_topic: ""
        wrist_camera_info_topic: ""
        wrist_aligned_depth_topic: ""
        wrist_pointcloud_topic: ""
        ee_pose_topic: /robot_status/ee_pose
        joint_state_topic: /joint_states
        require_depth: false
        require_pointcloud: false
      vlm_api:
        provider: openai_compatible
        base_url: http://localhost:8000/v1
        api_key_env: ""
        model: Qwen3.5-9B
        max_image_width: 320
        jpeg_quality: 70
      conversation:
        max_history_turns: 4
    visual_games:
      sorting_hat:
        enabled: false
        announce: true
        handler: sorting_hat_v1
        summary: 根据主相机中的人物形象判断其霍格沃茨学院
    execution:
      relative_motion_step_m: 0.03
      relative_motion_reference_frame: base
      relative_motion_direction_mapping:
        forward: [0.0, -1.0, 0.0]
        backward: [0.0, 1.0, 0.0]
        left: [1.0, 0.0, 0.0]
        right: [-1.0, 0.0, 0.0]
        up: [0.0, 0.0, 1.0]
        down: [0.0, 0.0, -1.0]
      gripper_open_position: 1.0
      gripper_closed_position: 0.15
      task_executor_action_name: /task_executor/execute_task_plan
    safety:
      workspace:
        x: [-0.32, 0.25]
        y: [-0.42, 0.00]
        z: [0.05, 0.55]
    named_poses:
      home:
        position: {x: 0.020030733201442157, y: -0.11809839488683391, z: 0.13887055751050842}
        orientation: {x: -0.26790866048257905, y: -0.2622185975709204, z: -0.6525133891660432, w: 0.6585534402654153}
      observe_table:
        position: {x: 0.02160863957360322, y: -0.1310933191355222, z: 0.33769602460194537}
        orientation: {x: -0.35328551634048977, y: -0.32020226597268203, z: -0.5842845082802226, w: 0.6567126207053827}
      zero:
        position: {x: 0.0210077843415008, y: -0.278950111258735, z: 0.24858389783148477}
        orientation: {x: -0.4740206645801369, y: -0.4668084047044082, z: -0.523033090590171, w: 0.532757645647648}

  # IB-Robot contract: logical bindings against the runtime public description.
  contract:
    base_contract: $(find robot_config)/config/contracts/act_grab_pan.yaml
    rate_hz: 20
    max_duration_s: 90.0

    observations:
      - key: observation.images.front
        interface: camera.front.color
        requires: {width: 640, height: 480, min_fps: 15}
        image:
          resize: [480, 640]
        align:
          strategy: hold
          stamp: header
          tol_ms: 1500
          max_age_ms: 500

      - key: observation.images.top
        interface: camera.top.color
        requires: {width: 640, height: 480, min_fps: 15}
        image:
          resize: [480, 640]
        align:
          strategy: hold
          stamp: header
          tol_ms: 1500
          max_age_ms: 500

      - key: observation.images.wrist
        interface: camera.wrist.color
        requires: {width: 640, height: 480, min_fps: 15}
        image:
          resize: [480, 640]
        align:
          strategy: hold
          stamp: header
          tol_ms: 1500
          max_age_ms: 500

      - key: observation.state
        interface: joint.state
        selector: { names: ["position.1", "position.2", "position.3", "position.4", "position.5", "position.6"] }
        align:
          strategy: hold
          stamp: header
          tol_ms: 1500
          max_age_ms: 500

      - key: observation.current
        interface: joint.current
        selector: { names: ["current.1", "current.2", "current.3", "current.4", "current.5", "current.6"] }
        align:
          strategy: hold
          stamp: header
          tol_ms: 1500
          max_age_ms: 500

    actions:
      - key: action
        selector:
          names:
            - "action.0"
            - "action.1"
            - "action.2"
            - "action.3"
            - "action.4"
        publish:
          interface: joint.arm_stream
        safety_behavior: hold

      - key: action
        selector:
          names:
            - "action.5"
        publish:
          interface: joint.gripper_stream
        safety_behavior: hold

  # Teleoperation: input devices live in the runtime-owned input config; this
  # section selects the active source, the public target interfaces and the
  # application speed policy. Streaming is admitted explicitly (idle start).
  teleoperation:
    enabled: true
    active_device: "so101_leader"
    # Operator input deployment config lives on the app side (robot_config),
    # not inside the robot runtime package. Runtime model info (joints, limits,
    # frames) comes from the public description via /runtime/get_status;
    # hardware acquisition (serial, calibration) stays with the hardware node.
    input_config: $(find robot_config)/config/teleop/so101_leader_inputs.yaml
    target:
      group: arm
      gripper_group: gripper
      interfaces:
        joints: motion.arm.joints
        pose: motion.arm.pose
        linear: motion.arm.linear
        angular: motion.arm.angular
        start: motion.arm.start
        stop: motion.arm.stop
        home: motion.arm.home
        lease: motion.arm.lease
    control_params:
      cartesian_linear_speed: 0.17
      cartesian_angular_speed: 0.2
    safety:
      # Relative narrowing (rad), applied inward on the runtime public limits.
      # Absolute limits here would be stale snapshots that conflict whenever
      # the arm is recalibrated.
      joint_limits_margin: 0.05

  recording:
    bag_base_dir: "~/rosbag/episodes"
    storage: mcap
    # This robot's deployed ACT policy was trained from centered-degree joint data.
    lerobot_norm_mode: degrees
