# SO-101 Agent execution overlay for Gazebo only. The Agent node refuses this
# mode when the parent launch does not set use_sim:=true.
robot:
  name: so101_single_arm
  base_config: so101_single_arm_agent_test.yaml
  audio_io:
    enabled: false
  voice_asr:
    enabled: false
  voice_tts:
    enabled: false
  peripherals:
    - name: top
      type: camera
      disabled: true
    - name: wrist
      type: camera
      disabled: true
    - name: front
      type: camera
      disabled: true
  embodied:
    agent:
      channel_id: agent_cli
      execution_enabled: true
      ledger_path: /tmp/ibrobot-agent-so101-gazebo/requests.sqlite3
      conversation_path: /tmp/ibrobot-agent-so101-gazebo/conversation.sqlite3
      deployment_lock_path: /tmp/ibrobot-agent-so101-gazebo/agent.lock
  contract:
    observations: []
