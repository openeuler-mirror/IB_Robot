# SO-101 Agent hardware cancellation trial. Only wave_hello is admitted.
robot:
  name: so101_single_arm
  base_config: so101_single_arm_agent_hardware.yaml
  audio_io:
    enabled: false
  voice_asr:
    enabled: false
  voice_tts:
    enabled: false
  peripherals:
    - name: top
      type: camera
      disabled: true
    - name: wrist
      type: camera
      disabled: true
    - name: front
      type: camera
      disabled: true
  embodied:
    agent:
      test_allowlist:
        - wave_hello
      ledger_path: /tmp/opencode/ibrobot-agent-so101-hardware-stop/requests.sqlite3
      conversation_path: /tmp/opencode/ibrobot-agent-so101-hardware-stop/conversation.sqlite3
      deployment_lock_path: /tmp/opencode/ibrobot-agent-so101-hardware-stop/agent.lock
