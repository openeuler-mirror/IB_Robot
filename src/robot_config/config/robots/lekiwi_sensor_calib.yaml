# Sensor calibration profile with manual base teleoperation for the current LeKiwi installation.
#
# Migrated onto the LeKiwi runtime (openspec lekiwi-application-migration
# task 1.5): the runtime profile lekiwi_robot/profiles/lekiwi_lidar.yaml owns
# the base-only chassis, controllers and the MID-360; the front RealSense
# below is the deployment addition handed to the runtime through the
# peripherals fragment, and FAST-LIO runs under the runtime with the policy
# declared here. Manual base teleoperation during capture is admitted through
# the contract /cmd_vel channel: the launch-time admission step selects
# base_navigation and opens the navigation gate (navigation.open_gate_on_startup)
# after the runtime is ready.
#
# This profile intentionally uses the ROS installation's realsense2_camera package.
robot:
  name: lekiwi_sensor_calib
  type: lekiwi
  robot_type: lekiwi

  runtime:
    provider: lekiwi_robot
    profile: lekiwi_lidar
    # require_model stays unset: the front camera below is deployment
    # inventory passed to the runtime as the peripherals fragment.

  default_control_mode: teleop
  mid360_mount_file: $(find lekiwi_description)/config/lekiwi_mid360_mount.yaml

  sensor_calibration:
    artifacts:
      base_to_front_camera: ~/.ros/ibrobot/calib/current/base_to_front_camera.yaml

  joints:
    base: ["7", "8", "9"]
    all: ["7", "8", "9"]

  control_modes:
    teleop:
      description: "Sensor calibration profile with manual base teleoperation"
      description_cn: "支持手动底盘遥操作的传感器标定配置"
      runtime_mode: base_navigation
      inference:
        enabled: false
        force_disable: true
      executor:
        type: topic
        mode: teleop
        queue_size: 10
        control_frequency: 10.0

  simulation:
    platform: sdk
    scene: null

  peripherals:
    # Deployment opt-in on top of the profile's MID-360 and front RealSense:
    # the profile declares the camera and its driver (disabled by default);
    # this entry enables it for base-to-camera extrinsic calibration.
    - type: camera
      name: front
      enabled: true
      driver_camera_name: front
      serial_number: ""
      width: 640
      height: 480
      fps: 30
      streams: [color, depth]
      align_depth: false
      enable_sync: false
      initial_reset: false
      enable_pointcloud: false
      frame_id: camera_front_link
      optical_frame_id: camera_front_optical_frame
      transform:
        parent_frame: base_link
        x: 0.0
        y: 0.0
        z: 0.0
        roll: 0.0
        pitch: 0.0
        yaw: 0.0

  navigation:
    enabled: true
    open_gate_on_startup: true
    # FAST-LIO policy for the runtime provider; topics, frames and params come
    # from the runtime profile. FAST-LIO owns the odom -> base_link transform.
    fast_lio:
      enabled: true
      planar_output: false
      publish_tf: true
    nav2_bringup:
      enabled: false
    slam_toolbox:
      enabled: false

  recording:
    enabled: false
