# LeKiwi Mobile Manipulator - Evaluation Configuration
# Single Source of Truth for LeKiwi RealSense navigation.
#
# This config enables RealSense navigation to load robot configuration from YAML
# instead of hardcoding LeKiwiClientConfig(remote_ip=..., id=...).
# Actions are dispatched via ROS topics to ros2_control controllers.

robot:
  name: lekiwi_realsense_navigation
  type: lekiwi
  robot_type: lekiwi  # For LeRobot dataset metadata

  # ============================================
  # Unified joint definitions (Single Source of Truth)
  # ============================================
  joints:
    arm:
      - "1"
      - "2"
      - "3"
      - "4"
      - "5"
    gripper:
      - "6"
    base:
      - "7"
      - "8"
      - "9"
    all: ["1", "2", "3", "4", "5", "6"]

  # Control mode management
  default_control_mode: "model_inference"

  control_modes:
    teleop:
      description: "Human teleoperation mode (leader arm + keyboard base)"
      description_cn: "人工遥操作模式（leader arm + 键盘底盘）"
      controllers:
        - joint_state_broadcaster
        - arm_position_controller
        - gripper_position_controller
        - base_velocity_controller
      inference:
        enabled: false
      executor:
        type: topic
        mode: teleop
        queue_size: 100
        control_frequency: 50.0

    model_inference:
      description: "LeKiwi end-to-end control mode (ACT policy)"
      controllers:
        - joint_state_broadcaster
        - arm_position_controller
        - gripper_position_controller
        - base_velocity_controller
      inference:
        enabled: true
        pipelines:
          navigation_policy:
            model_path: models/act/pretrained_model
            deployment: cpu
            execution_mode: distributed
            request_timeout: 5.0
      # ============================================
      # Executor configuration
      # ============================================
      executor:
        type: topic  # topic | action
        mode: model_inference
        inference_pipeline: navigation_policy
        queue_size: 100
        watermark_threshold: 0
        control_frequency: 30.0

    navi:
      description: "Navigation evaluation mode (RealSense + ACT policy)"
      description_cn: "导航评估模式（RealSense + ACT 策略）"
      controllers:
        - joint_state_broadcaster
        - arm_position_controller
        - gripper_position_controller
        - base_velocity_controller
      inference:
        enabled: true
        pipelines:
          navigation_policy:
            model_path: models/act/pretrained_model
            deployment: cpu
            execution_mode: distributed
            request_timeout: 5.0
      executor:
        type: topic
        mode: navi
        inference_pipeline: navigation_policy
        dispatcher: action_dispatch    # unified action dispatcher
        navigation_mode: true          # enable navigation mode (explicit start/stop + base control)
        watermark_threshold: 20
        control_frequency: 30.0

  # ============================================
  # Voice ASR Configuration
  # ============================================
  voice_asr:
    enabled: true
    active_mode: continuous
    language: zh
    bundle_path: models/voice_asr/sherpa-onnx-streaming-paraformer-zh
    deployment: torch_cpu
    publish_partial: true
    output_topic: /voice_command
    audio_input_channel: 0

  audio_io:
    enabled: true
    microphone: microphone
    capture_topic: /audio/capture
    capture_stamped_topic: /audio/capture_stamped
    audio_info_topic: /audio/info

  # ============================================
  # Navigation Configuration
  # ============================================
  navigation:
    enabled: true

    # Authoritative body-frame envelope for navigation controllers. These
    # conservative simultaneous-motion limits reserve wheel-speed headroom and
    # remain subject to the MPPI simulation and low-speed hardware gates.
    motion_envelope:
      velocity:
        vx: {min: -0.13, max: 0.13}  # m/s
        vy: {min: -0.11, max: 0.11}  # m/s
        wz: {min: -0.44, max: 0.44}  # rad/s; not the pure-rotation physical limit
      acceleration:
        vx: {min: -0.65, max: 0.65}  # m/s^2
        vy: {min: -0.55, max: 0.55}  # m/s^2
        wz: {min: -2.2, max: 2.2}    # rad/s^2

    robot_description:
      urdf_path: $(find lekiwi_description)/urdf/lekiwi_assembled.urdf.xacro

    nav2_bringup:
      enabled: true
      map_file: "$(env HOME)/.ros/ibrobot/maps/rtabmap.yaml"
      # MPPI remains a candidate until simulation timing and hardware gates pass.
      params_file: "$(find robot_navigation)/config/nav2_params_dwb.yaml"

    ekf_rtabmap:
      enabled: true
      rtabmap:
        database_path: "$(env HOME)/.ros/ibrobot/maps/rtabmap.db"
        localization: true
        visual_odometry: false
        frame_id: camera_link
        odom_frame_id: odom
        odom_topic: /odometry/filtered
        # RealSense driver topics are adapted in perception.py to the stable contract.
        rgb_topic: /camera/realsense/image_raw
        depth_topic: /camera/realsense/depth/image_rect_raw
        camera_info_topic: /camera/realsense/camera_info
        approx_sync: true
        queue_size: 20
        qos_image: 2
        qos_camera_info: 2
        qos_odom: 2
        rtabmap_args: "--Mem/InitWMWithAllNodes true --Mem/IncrementalMemory false --Mem/PermanentMemory true --Mem/STMSize 8 --Reg/Force3DoF true"
        log_level: error
      depth_to_laserscan:
        enabled: true
        output_frame: camera_link
        depth_topic: /camera/realsense/depth/image_rect_raw
        depth_camera_info_topic: /camera/realsense/camera_info
      ekf:
        config_file: "$(find robot_config)/config/lekiwi/navigation/ekf_minimal.yaml"

    cmd_vel_bridge:
      enabled: true
      wheel_radius: 0.05
      base_radius: 0.125
      max_radps: 4.602  # Max wheel angular velocity (rad/s), matches base_vel_max_rad
      odom_frame: odom
      base_frame: base_link
      publish_tf: false
      control_frequency: 50.0
      cmd_timeout: 0.5
      cmd_vel_topic: /cmd_vel
      joint_states_topic: /joint_states
      odom_topic: /odom

    robot_navigation:
      enabled: true
      enable_voice_control: true
      keywords_file: ""
      global_frame: map
      enable_feedback: true
      trigger_evaluation: false
      destinations:
        point_a:
          x: 0.0
          y: 0.2
          theta: 1.5708  # rad (90 deg)
        point_b:
          x: 0.2
          y: 0.0
          theta: 0.0
        origin:
          x: 0.0
          y: 0.0
          theta: 0.0

    rviz:
      enabled: false
      config_file: ""

  object_tracking:
    enabled: false
    production_ready: false
    frame_id: odom
    camera:
      rgb_topic: /camera/realsense/color/image_raw
      aligned_depth_topic: /camera/realsense/aligned_depth_to_color/image_raw
      camera_info_topic: /camera/realsense/color/camera_info
      optical_frame: camera_color_optical_frame
      sync_slop_ms: 33.0
      queue_size: 10
    depth:
      scale: 0.001
      min_m: 0.15
      max_m: 8.0
      min_valid_ratio: 0.2
      central_fraction: 0.6
    tracker:
      max_prediction_s: 0.5
      innovation_gate: 9.21
      confirmation_interval_s: 2.0
      max_reacquisition_attempts: 3
      motion_window_samples: 3
      min_object_displacement_m: 0.08
      min_object_speed_mps: 0.05
      motion_sigma_multiplier: 3.0
      moving_confirmation_windows: 2
      stationary_confirmation_windows: 2
      max_motion_position_variance_m2: 0.25
      max_motion_sample_gap_s: 3.0
      robot_linear_motion_threshold_mps: 0.02
      robot_angular_motion_threshold_rps: 0.05
    interfaces:
      start: /object_tracker/start_tracking
      stop: /object_tracker/stop_tracking
      state: /object_tracker/track_state
      get_state: /object_tracker/get_track_state
    following:
      enabled: false
      production_ready: false
      stand_off_distance_m: 0.8
      replan_displacement_m: 0.2
      minimum_replan_interval_s: 1.0
      cancellation_timeout_s: 2.0
      action_timeout_s: 2.0
      max_spin_attempts: 1
      max_search_duration_s: 15.0
      global_frame: map
      target_frame: odom
      base_frame: base_link
      track_state_topic: /object_tracker/track_state
      replan_heading_rad: 0.261799
      target_timeout_s: 1.0
      max_covariance_m2: 0.25
      compute_path_action: /compute_path_to_pose
      follow_path_action: /follow_path
      controller_id: FollowPath

  simulation:
    platform: gazebo
    scene: null

  # ============================================
  # ros2_control
  # ============================================
  ros2_control:
    hardware_plugin: lekiwi_hardware/LeKiwiSystemHardware
    port: /dev/ttyACM0
    calib_file: $(env HOME)/.calibrate/so101_follower_calibrate.json
    joint_names: ["1", "2", "3", "4", "5", "6"]
    velocity_joints: ["7", "8", "9"]
    # Max base velocity in physical units (rad/s).
    # Equivalent to the former base_vel_max_raw=3000 (≈4.602 rad/s).
    # ros2_control velocity controller commands are in rad/s;
    # lekiwi_hardware converts rad/s → raw steps/s for the STS3215 motors.
    base_vel_max_rad: 4.602
    urdf_path: $(find lekiwi_description)/urdf/lekiwi_assembled.urdf.xacro
    controllers_config: $(find lekiwi_hardware)/config/lekiwi_controllers.yaml

  # ============================================
  # Peripheral devices
  # ============================================
  peripherals:
    - type: microphone
      name: microphone
      driver: alsa
      params:
        device: "default"
        channels: 1
        sample_rate: 16000
        sample_format: S16LE
        channel_indices: [0, 0, 0, 0]

    - type: camera
      name: front
      driver: opencv
      index: 4
      width: 640
      height: 480
      fps: 30
      fovy: 60
      pixel_format: mjpeg2rgb
      frame_id: camera_front_frame
      optical_frame_id: camera_front_optical_frame
      brightness: -1
      contrast: -1
      saturation: -1
      autoexposure: true
      exposure: -1
      auto_white_balance: true
      white_balance: -1
      transform:
        parent_frame: base_link
        x: 0.1
        y: 0.2
        z: 0.0
        roll: -1.5708
        pitch: 0.0
        yaw: 0.0

    - type: camera
      name: wrist
      driver: opencv
      index: 6
      width: 640
      height: 480
      fps: 30
      fovy: 60
      pixel_format: mjpeg2rgb
      frame_id: camera_wrist_frame
      optical_frame_id: camera_wrist_optical_frame
      brightness: -1
      contrast: -1
      saturation: -1
      autoexposure: true
      exposure: -1
      auto_white_balance: true
      white_balance: -1
      transform:
        parent_frame: gripper
        x: 0.0
        y: 0.0
        z: 0.0
        roll: 0.0
        pitch: 0.0
        yaw: 0.0

    # RealSense 深度相机（用于导航定位）
    # camera_name=realsense → 驱动 TF 帧：realsense_link -> realsense_color_optical_frame
    - type: camera
      name: realsense
      driver: realsense
      driver_camera_name: realsense_camera
      serial_number: ""
      width: 640
      height: 480
      fps: 30
      pixel_format: bgr8
      enable_pointcloud: false
      align_depth: true
      enable_sync: true
      frame_id: camera_link
      optical_frame_id: camera_color_optical_frame
      transform:
        parent_frame: base_link
        x: 0.0
        y: 0.0
        z: 0.3
        roll: 0.0
        pitch: 0.0
        yaw: 0.0

  # ============================================
  # Contract - I/O mapping for policy inference
  # ============================================
  contract:
    rate_hz: 30
    max_duration_s: 600.0

    observations:
      # Front camera image
      - key: observation.images.front
        topic: /camera/front/image_raw
        type: sensor_msgs/msg/Image
        peripheral: front
        image:
          resize: [480, 640]
        align:
          strategy: hold
          stamp: header
          tol_ms: 1500
        qos:
          reliability: best_effort
          history: keep_last
          depth: 10

      # Wrist camera image
      - key: observation.images.wrist
        topic: /camera/wrist/image_raw
        type: sensor_msgs/msg/Image
        peripheral: wrist
        image:
          resize: [480, 640]
        align:
          strategy: hold
          stamp: header
          tol_ms: 1500
        qos:
          reliability: best_effort
          history: keep_last
          depth: 10

      # Joint state: 6 arm/gripper positions + 3 base velocities
      # Published by ros2_control joint_state_broadcaster
      # dot_get format: "<ros_field>.<joint_name>" where ros_field = position | velocity
      - key: observation.state
        topic: /joint_states
        type: sensor_msgs/msg/JointState
        selector:
          names:
            - "position.1"
            - "position.2"
            - "position.3"
            - "position.4"
            - "position.5"
            - "position.6"
            - "velocity.7"
            - "velocity.8"
            - "velocity.9"
        align:
          strategy: hold
          stamp: header
          tol_ms: 500
        qos:
          reliability: best_effort
          history: keep_last
          depth: 50

    actions:
      # Arm joints (5) via ros2_control position controller
      - key: action
        selector:
          names:
            - "action.0"
            - "action.1"
            - "action.2"
            - "action.3"
            - "action.4"
        publish:
          topic: /arm_position_controller/commands
          type: std_msgs/msg/Float64MultiArray
          layout: flat
          qos:
            reliability: best_effort
            history: keep_last
            depth: 10
        safety_behavior: hold

      # Gripper (1) via ros2_control position controller
      - key: action
        selector:
          names:
            - "action.5"
        publish:
          topic: /gripper_position_controller/commands
          type: std_msgs/msg/Float64MultiArray
          layout: flat
          qos:
            reliability: best_effort
            history: keep_last
            depth: 10
        safety_behavior: hold

      # Base wheel velocities (3) via ros2_control velocity controller
      - key: action
        selector:
          names:
            - "action.6"
            - "action.7"
            - "action.8"
        publish:
          topic: /base_velocity_controller/commands
          type: std_msgs/msg/Float64MultiArray
          layout: flat
          qos:
            reliability: best_effort
            history: keep_last
            depth: 10
        safety_behavior: zeros

  # ============================================
  # Teleoperation Configuration (leader arm + keyboard base)
  # ============================================
  teleoperation:
    enabled: true
    active_device: "so101_leader"
    devices:
      - name: "so101_leader"
        type: "leader_arm"
        port: "/dev/ttyACM1"
        calib_file: "$(env HOME)/.calibrate/so101_leader_calibrate.json"
    safety:
      joint_limits:
        "1": {"min": -3.14159, "max": 3.14159}
        "2": {"min": -3.14159, "max": 3.14159}
        "3": {"min": -3.14159, "max": 3.14159}
        "4": {"min": -3.14159, "max": 3.14159}
        "5": {"min": -3.14159, "max": 3.14159}
        "6": {"min": 0.0, "max": 1.0}

  # ============================================
  # Recording Configuration
  # ============================================
  recording:
    bag_base_dir: "~/rosbag/episodes"
    storage: mcap
