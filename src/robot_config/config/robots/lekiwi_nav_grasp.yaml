# Unified LeKiwi mobile-manipulator configuration for grasping and MID-360 navigation.
#
# Hardware assumptions:
# - LeKiwi omnidirectional base (joints 7/8/9) with SO-101 follower arm (joints 1-6)
#   driven by the unified LeKiwiSystemHardware plugin
# - follower joint calibration at ~/.calibrate/so101_follower_calibrate.json
# - two D435i cameras connected to the 310P board: one rigidly mounted on the
#   SO-101 gripper and one fixed to the LeKiwi base for semantic mapping
# - a ReSpeaker microphone array connected to the 310P board for speech direction
# - during grasp execution the base is held still; only arm + gripper move
# - navigation owns only base joints 7/8/9; motion_mode enforces mutual exclusion
#
# Cameras are named by role: "wrist" is parented to the gripper and "front" is
# parented to base_link. The USB connection location does not define the mount.

robot:
  name: lekiwi_handeye_realsense_grasp_lidar
  type: lekiwi
  robot_type: lekiwi

  # The default hybrid stage keeps grasp and navigation services alive in one
  # Hermes runtime.  Motion ownership remains mutually exclusive: arm/gripper
  # controllers own joints 1-6, while base_velocity_controller owns joints 7-9.
  # The legacy grasp/mapping/navigation stages remain available for migration.
  default_nav_stage: hybrid
  mid360_mount_file: $(find robot_config)/config/hardware/lekiwi_mid360_mount.yaml

  sensor_calibration:
    artifacts:
      base_to_front_camera: ~/.ros/ibrobot/calib/current/base_to_front_camera.yaml

  joints:
    arm:
      - "1"
      - "2"
      - "3"
      - "4"
      - "5"
    gripper:
      - "6"
    base:
      - "7"
      - "8"
      - "9"
    all: ["1", "2", "3", "4", "5", "6", "7", "8", "9"]

  moveit:
    arm_group_name: arm
    base_link: base
    ee_link: gripper
    shoulder_link: shoulder
    # MoveIt consumes only arm/gripper joints; the full /joint_states remains
    # available to navigation and dataset consumers.
    joint_state_topic: /arm_joint_state_broadcaster/joint_states
    # Return as soon as a post-terminal hardware read, converged joint sample,
    # and the corresponding robot_state_publisher TF are all observable.
    motion_status_hold_s: 0.0
    motion_feedback_timeout_s: 0.3
    motion_feedback_tolerance_rad: 0.12
    motion_require_tf_sync: true
    # LeKiWi read failures now return ERROR, so a fresh JointState can only
    # follow a complete hardware read; no separate heartbeat topic is needed.
    motion_hardware_feedback_topic: ""

  # Controllers and hardware stay loaded across tasks. This control-plane gate
  # changes which subsystem may accept new commands and switches active controller
  # ownership atomically; arm/gripper and base command domains remain disjoint.
  motion_mode:
    enabled: true
    navigation_enabled_on_startup: false
    navigation_enabled_topic: motion_mode/navigation_enabled
    navigation_mode_ack_topic: motion_mode/base_navigation_enabled
    set_navigation_enabled_service: motion_mode/set_navigation_enabled
    controller_switch_service: controller_manager/switch_controller
    manipulation_controllers: [arm_trajectory_controller, gripper_trajectory_controller]
    navigation_controllers: [base_velocity_controller]
    transition_timeout_s: 5.0
    bridge_heartbeat_timeout_s: 5.0
    manipulation_control_mode: moveit_planning
    navigation_control_mode: base_navigation

  skill_required_control_mode: "moveit_planning"
  semantic_mapping:
    # Enabled by default: the default hybrid stage keeps online semantic
    # mapping alive alongside grasp and navigation. The lean legacy stages
    # (grasp/mapping/navigation) opt out explicitly below. The camera contract
    # is declared here so enabling mapping cannot fall back to the wrist
    # camera by accident.
    enabled: true
    # Keep the persisted map queryable while disabling online RGB-D updates.
    query_only: true
    camera:
      peripheral: front
      mounting: fixed
      parent_frame: base_link
      rgb_topic: /camera/front/image_raw
      depth_topic: /camera/front/aligned_depth_to_color/image_raw
      camera_info_topic: /camera/front/camera_info
    slam:
      # Identity of the reviewed lab-083830 semantic map deployed on LeKiwi.
      # Runtime readiness still derives live flags from AMCL pose, map->odom
      # TF, and the registered cloud when FAST-LIO publishes no identity topic.
      global_frame: map
      cloud_map_topic: /cloud_registered_body
      active_map_hash_topic: /slam/active_geometry_map_hash
      localization_ready_topic: /slam/localization_ready
      authoritative_map_odom_topic: /slam/authoritative_map_odom_ready
      geometry_map_id: fastlio-lekiwi-newbag
      geometry_map_hash: newbag-offline-hash-001
      localization_session_id: newbag-offline-session-001
      calibration_id: newbag-offline-calib-001
      urdf_hash: newbag-offline-urdf-001
      coordinate_convention: ros-rep-103-map-enu
      map_odom_authority: slam
    perception:
      mapping_backend: service
      service_wait_sec: 1.0
      semantic_roles:
        sam2_masks: semantic_sam2_masks
        ram_plus_tags: semantic_ram_plus_tags
        siglip2_image: semantic_siglip2_image
        siglip2_text: semantic_siglip2_text
      allow_legacy_embedded: false
    persistence:
      database_path: ~/maps/lab-083830/semantic_map.sqlite3
      artifact_output_dir: ~/.ros/ibrobot/semantic_artifacts
    filtering:
      depth_trunc_m: 4.0
      min_points: 30
      min_frame_valid_depth_ratio: 0.05
      min_mask_pixels: 300
      min_mask_area_ratio: 0.001
      min_mask_valid_depth_ratio: 0.2
      max_mask_overlap_ratio: 0.8
      ground_filter_enabled: true
      ground_reference_frame: base_link
      ground_height_offset_m: 0.0
      ground_max_bottom_clearance_m: 0.15
      ground_max_object_height_m: 0.75
      ground_max_footprint_m: 1.2
      max_object_extent_m: 0.65
      max_object_distance_m: 2.5
    queue:
      sync_queue_size: 10
      sync_slop_sec: 0.06
      tf_timeout_sec: 0.15
      processing_interval_sec: 0.5
      frame_capacity: 2
      policy: drop_oldest
      max_masks_per_frame: 32
      max_masks_per_batch: 8
    lifecycle:
      association_distance_m: 0.45
      association_max_size_ratio: 4.0
      association_position_weight: 0.55
      embedding_similarity_threshold: 0.72
      label_switch_confidence_margin: 0.05
      stale_after_sec: 10.0
      move_stability_m: 0.1
      move_confirmations: 2
    labels:
      min_confidence: 0.2
      max_candidates_per_mask: 5
      recurrence_count_ratio: 3.0
      high_confidence_override_margin: 0.08
      excluded_labels:
        # Scene background, generic concepts, shapes, and action-like RAM++ noise.
        - animal
        - attach
        - bite
        - bomb
        - briefcase
        - building
        - candle
        - cloud
        - cloudy
        - cloth
        - color
        - container
        - cube
        - cylinder
        - draw
        - drive
        - eagle
        - face
        - fighter jet
        - fly
        - floor
        - food
        - foot
        - fruit
        - gun
        - hang
        - hand
        - hay
        - hot
        - image
        - iceberg
        - jet
        - line
        - liquid
        - man
        - missile
        - move
        - oval
        - person
        - photo
        - polygon
        - plastic
        - plane
        - pole
        - rectangle
        - reflection
        - room
        - shape
        - sheet
        - sign
        - sky
        - square
        - stack
        - stop sign
        - stop light
        - street sign
        - tear
        - tie
        - toothpaste
        - traffic light
        - triangle
        - unlabeled
        - water
        - wind
    label_refinement:
      enabled: false
      model: gpt-5.6-sol
      model_identity: xunxing/gpt-5.6-sol@az.gptplus5.com
      prompt: >-
        The left panel is the full indoor office/laboratory scene with the target highlighted in green and boxed in
        red. The right panel is an enlarged masked crop of that target. Identify exactly one concrete, physically
        manipulable item plausible in a robotics laboratory. Use the most specific common object noun supported by
        the image. Prefer banana over food or fruit, trash can or bin over container or plastic, crumpled paper over
        paper or cloth, and marker over cylinder. Never answer with a material, shape, color, visual attribute,
        action, scene/background, or broad parent category. RAM++ candidates are weak hints and may all be wrong.
      min_confidence: 0.8
      trigger_below_confidence: 0.7
      min_observations: 1
    target_watch:
      max_attempts: 3
      scan_profile: fixed_d435_base_scan
      stand_off_distance_m: 0.3
      clearance_m: 0.2
      track_state_updates_enabled: true
      track_state_topic: /object_tracker/track_state
      track_state_frame: odom
      track_state_max_age_sec: 1.0
      track_state_max_covariance_m2: 0.25
      track_state_confirmation_gap_sec: 1.0
      track_state_persist_interval_sec: 1.0
      footprint_ready_topic: /navigation/footprint_ready
      obstacle_map_ready_topic: /navigation/obstacle_map_ready
      reachability_ready_topic: /navigation/reachability_ready
    interfaces:
      semantic_map_topic: /semantic_mapping/objects
      object_cloud_topic: /semantic_mapping/object_cloud
      query_service: /semantic_mapping/get_objects
      target_service: /semantic_mapping/resolve_target

  perception_services:
    services:
      - id: grasp_grounding
        enabled: true
        required: true
        bundle_path: models/grounding_dino_swint_seq8_1280x720
        deployment: ascend_310p
        adapter_class: perception_service.model_service_plugins:GroundingDINORawDetectPlugin
        service_type: ibrobot_msgs/srv/GroundingDetect
        endpoint: /perception/grasp/grounding_detect
        node_name: grasp_grounding_detect
        runtime_options:
          device_id: 0
      - id: grasp_segmentation
        enabled: true
        required: true
        bundle_path: models/sam2.1_hiera_tiny_prompt_ascend
        deployment: ascend_310p
        adapter_class: perception_service.model_service_plugins:SegmentDetectionsPlugin
        service_type: ibrobot_msgs/srv/SegmentDetections
        endpoint: /perception/grasp/segment_detections
        node_name: grasp_segment_detections
        runtime_options:
          device_id: 0
      # Semantic-mapping model services for online mapping. They are enabled by
      # default together with semantic_mapping above; the lean legacy stages
      # opt out below. SAM2 here is the automatic mask generator and is
      # intentionally a different bundle from the grasp prompt segmenter.
      - id: semantic_sam2_masks
        enabled: true
        required: true
        bundle_path: models/sam2.1_hiera_tiny
        deployment: ascend_310p
        adapter_class: perception_service.model_service_plugins:SAM2GenerateMasksPlugin
        service_type: ibrobot_msgs/srv/GenerateMasks
        endpoint: /semantic_perception/semantic_sam2_masks
        node_name: semantic_sam2_masks
        runtime_options:
          device_id: 0
      - id: semantic_ram_plus_tags
        enabled: true
        required: true
        bundle_path: models/ram_plus_swin_large_14m
        deployment: ascend_310p
        adapter_class: perception_service.model_service_plugins:RAMPlusRecognizeTagsPlugin
        service_type: ibrobot_msgs/srv/RecognizeTags
        endpoint: /semantic_perception/semantic_ram_plus_tags
        node_name: semantic_ram_plus_tags
        runtime_options:
          device_id: 0
      - id: semantic_siglip2_image
        enabled: true
        required: true
        bundle_path: models/siglip2_so400m_patch14_384
        deployment: ascend_310p
        adapter_class: perception_service.model_service_plugins:SigLIP2EncodeEmbeddingsPlugin
        service_type: ibrobot_msgs/srv/EncodeEmbeddings
        endpoint: /semantic_perception/semantic_siglip2_image
        node_name: semantic_siglip2_image
        runtime_options:
          device_id: 0
      - id: semantic_siglip2_text
        # Optional role: text encoding shares the SigLIP2 bundle with the
        # image service and must stay non-required per the role policy.
        enabled: true
        required: false
        bundle_path: models/siglip2_so400m_patch14_384
        deployment: ascend_310p
        adapter_class: perception_service.model_service_plugins:SigLIP2EncodeTextPlugin
        service_type: ibrobot_msgs/srv/EncodeText
        endpoint: /semantic_perception/semantic_siglip2_text
        node_name: semantic_siglip2_text
        runtime_options:
          device_id: 0

  grasp_execution:
    enabled: true
    action_name: /manipulation/execute_pick
    auto_start_dependencies: true
    # The 310P planner and the Gateway must bind the same immutable deployment
    # identity.  This bundle is produced by the GraspGen Ascend packager.
    model_bundle_path: "$(env WORKSPACE)/models/graspgen"
    model_deployment: ascend_310p
    # Both planner metadata and named deployments come from the same bundle.
    planner_model_dir: "$(env WORKSPACE)/models/graspgen"
    planner_service: /grasp_planner/plan_grasp
    verifier_service: /grasp_verifier/verify_grasp
    detect_service: /perception/grasp/grounding_detect
    fallback_detect_service: /grasp_planner/detect_and_segment
    segment_service: /perception/grasp/segment_detections
    ik_service: /compute_ik
    fk_service: /compute_fk
    joint_state_topic: /joint_states
    move_configuration_service: /moveit_gateway/move_to_configuration
    base_frame: base
    ee_frame: gripper
    observe_pose: observe_table
    timeout_sec: 240.0
    ready_timeout_sec: 30.0
    verification: required
    verification_timeout_sec: 5.0
    verification_wait_sec: 0.1
    recover_after_close_failure: true
    max_execution_attempts: 3
    approach_distance_m: 0.09
    # No base-coordinate offset on the candidate target.
    candidate_target_offset_base_m: [0.0, 0.0, 0.0]
    observe_velocity_scaling: 0.40
    approach_velocity_scaling: 0.35
    descend_velocity_scaling: 0.20
    # Used when release_after_success opens the gripper at place_container.
    release_settle_sec: 0.5
    observe_settle_sec: 0.4
    open_settle_sec: 0.2
    hold_sec: 0.5
    state_wait:
      # Fixed task waits are retained on real hardware. Joint-state stability
      # alone is not a hardware-health signal because broadcasters can republish
      # stale samples after a ros2_control hardware error.
      enabled: false
      minimum_sec: 0.05
      stable_sec: 0.06
      joint_delta_rad: 0.004
      gripper_tolerance_rad: 0.05
      gripper_joint: "6"
    camera:
      frame_id: camera_wrist_optical_frame
      rgb_topic: /camera/wrist/image_raw
      depth_topic: /camera/wrist/aligned_depth_to_color/image_raw
      camera_info_topic: /camera/wrist/aligned_depth_to_color/camera_info
    planner:
      confidence_threshold: 0.30
      grasp_threshold: 0.20
      timeout_sec: 120.0
      debug_output_mode: none
    candidate_selection:
      min_confidence: 0.0
      min_point_count: 100
      require_collision_free: false
      # Coarse bound on how far below the base origin a fingertip contact may
      # sit. The fitted tabletop plane measures 6 runs at z_base = -0.061 with a
      # 0.5 mm spread, plus one bad RANSAC fit at -0.069 (6.1 deg tilt); -0.08
      # clears the worst fit with margin. Sweeping lower adds no candidates.
      # The real collision gate stays target_geometry.tabletop_filter, which
      # is measured against the fitted plane and so does not drift with base height.
      min_contact_z: -0.07
      min_approach_z: 0.04
      min_topdown_score: 0.0
      topdown_min_z: -0.25
      max_candidates: 80
      # Bound fresh-frame replanning so a failed pick returns promptly.
      selection_attempts: 3
      retry_settle_sec: 0.2
      confidence_weight: 1.0
      topdown_weight: 0.50
    ik:
      group_name: arm
      # PR259-validated solver budget. LMA re-seeds from a random joint
      # configuration after a failed seeded attempt and keeps retrying until
      # this timeout expires, which destroys the joint5 seed that the IK
      # orientation guard writes back between attempts.
      timeout_sec: 0.20
      # Unreachable LMA requests can take about one second on the 310P host.
      # Wait on the service well past the solver budget so a loaded host is not
      # mistaken for an unhealthy IK worker.
      rpc_timeout_sec: 3.0
      avoid_collisions: false
      check_orientation: false
      worker_count: 1
      verification_position_tolerance_m: 0.001
      verification_orientation_tolerance_deg: 1.0
      worker_namespace_prefix: /ik_worker
      auto_start_workers: true
    contact_compensation:
      enabled: true
      xy_tolerance_m: 0.003
      max_iterations: 6
      max_correction_m: 0.03
      max_z_error_m: 0.020
    prepared_candidate_scoring:
      enabled: true
      # Prefer candidates that leave the narrow target inside the asymmetric
      # fixed/moving finger envelope without turning this preference into a reject.
      fixed_finger_envelope_weight: 0.55
      contact_xy_weight: 0.25
      contact_z_weight: 0.15
      confidence_weight: 0.05
      centroid_distance_weight: 0.50
      # Rank down candidates whose predicted fixed-finger robust gap would
      # make the execution phase retreat before closing.
      robust_gap_headroom_weight: 0.35
      contact_xy_scale_m: 0.030
      contact_z_scale_m: 0.020
      centroid_distance_scale_m: 0.010
      robust_gap_headroom_scale_m: 0.004
      fixed_finger_gap_sigma_m: 0.006
      missing_fixed_finger_envelope_score: 0.20
      missing_robust_gap_headroom_score: 0.50
      fixed_finger_score_weight: 0.80
      # Consumed by fixed_finger_envelope_score via prepared_candidate_scoring.
      # Keep these here: preparation.py reads them from this block, not from
      # target_gripper.
      reliable_max_opening_m: 0.072
      moving_finger_min_clearance_m: 0.003
    contact_realign:
      enabled: true
      tolerance_m: 0.008
      max_iterations: 2
      max_correction_m: 0.040
      # MoveIt completion already gates on fresh hardware, joints, and matching TF.
      settle_sec: 0.0
      pregrasp_enabled: true
      pregrasp_clearance_m: 0.030
    pose_diagnostics:
      enabled: true
      settle_sec: 0.0
      grasp_warn_threshold_m: 0.008
      grasp_realign_log_threshold_m: 0.010
      grasp_abort_log_threshold_m: 0.030
    frame_diagnostics:
      enabled: true
    planner_node:
      inference_backend: ascend_local
      local_manifest_path: "$(env WORKSPACE)/models/graspgen"
      local_deployment_name: ascend_310p
      ascend_local_manifest_path: "$(env WORKSPACE)/models/graspgen"
      ascend_local_deployment_name: ascend_310p
      ascend_local_device_id: 0
      ascend_local_random_seed: 0
      startup_warmup: true
      host_runtime:
        omp_threads: 4
        blas_threads: 1
      save_debug_outputs: false
      debug_output_dir: outputs/grasp_pipeline
      enable_collision_filter: false
      enable_tabletop_filter: true
      # Preserve table/object-top outputs; SO101 applies its own mesh hard gate downstream.
      enable_source_gripper_tabletop_sweep: false
      require_tabletop_filter: false
      tabletop_filter_mode: diagnostic
      tabletop_clearance: 0.002
      tabletop_pregrasp_distance: 0.08
      enable_object_cloud_completion: true
      object_cloud_completion_mode: mask_depth_inpaint
      enable_object_cloud_prismatic_extrude: true
      sync_max_age_sec: 0.8
      input_buffer_size: 90
      num_grasps: 5000
      # Bound downstream geometry/IK work after global confidence ranking.
      topk_num_grasps: 1000
    verifier_node:
      gripper_joint: "6"
      joint_state_topic: /joint_states
      # LeKiWi has no current publisher; the verifier uses calibrated gripper
      # contact plus wrist visibility as the authoritative evidence.
      joint_current_topic: ""
      wrist_depth_topic: /camera/wrist/aligned_depth_to_color/image_raw
      gripper_closed_position: 0.0
      # PC-compatible joint-6 position; 0.08 corresponds to the validated raw-tick contact boundary.
      gripper_contact_min_opening: 0.08
      gripper_no_contact_max_opening: 0.03
      current_contact_threshold_a: 0.08
      score_gripper_contact_success: 0.70
      score_gripper_contact_failure: 0.45
      score_gripper_residual_success: 0.18
      score_gripper_residual_failure: 0.12
      score_current_contact_success: 0.0
      score_current_contact_failure: 0.0
      score_wrist_occlusion_success: 0.10
      score_success_threshold: 0.65
      score_failure_threshold: 0.55
      score_margin_threshold: 0.20
    source_gripper: robotiq_2f_140
    source_contact_point: [0.0, 0.0, 0.195]
    adapter:
      source_to_ee_rpy: [3.141592653589793, 0.0, 0.0]
    # Robot-specific execution preference. GraspGen remains a robot-agnostic
    # source candidate provider; these weights tell the target robot which
    # candidates it can execute more reliably.
    execution_scoring:
      centroid_source: volume
      confidence_weight: 1.0
      contact_distance_weight: 1.0
      contact_distance_scale_m: 0.06
      topdown_weight: 0.50
    target_geometry:
      tabletop_filter: true
      # Matches the proven supervised banana-pick command while retaining a
      # hard fail-closed mesh check when the fitted plane is unavailable.
      tabletop_clearance_m: -0.025
      tabletop_sweep_steps: 5
      mesh_package: robot_description
      mesh_directory: meshes/lerobot/so101
    target_gripper:
      type: asymmetric_single_moving_jaw
      ee_frame: gripper
      # Aligned to the finger step contact region described in the GraspGen/SO101
      # runtime notes; fallback width keeps the effective center near z=-0.080.
      fixed_finger_contact_ee: [-0.014, 0.0, -0.080]
      # Vector from the fixed finger contact point toward the target width center.
      # It must align with the GraspGen source gripper width axis after source_to_ee_rpy.
      closing_axis_ee: [1.0, 0.0, 0.0]
      # The 5-DOF position-only IK keeps joint5 near its seed. Correct joint5
      # from the FK closing-axis error before candidate acceptance, canonicalize
      # it into the half-turn branch, and reject it if FK still misses these axes.
      ik_orientation_guard:
        enabled: true
        approach_axis_ee: [0.0, 0.0, 1.0]
        # false because target_gripper.type is asymmetric_single_moving_jaw.
        # A half turn about the approach axis keeps the closing line but swaps
        # which jaw is fixed, so target_contact_ee's closing-axis component
        # changes sign. Accepting a flipped branch feeds an ~11 mm phantom
        # contact error into contact_realign, which cannot cancel it by
        # translating and therefore accumulates until max_correction_m trips.
        closing_axis_180_symmetric: false
        # Enforce joint5 HOME, branch continuity, retry, and closing-axis gates.
        joint5_constraints_enabled: true
        # HOME joint5 comes from ros2_control.reset_positions["5"]. Initial
        # candidates are admitted only inside HOME +/- 90 deg, independent of
        # the observation-pose joint5 used as the position-only IK seed.
        joint5_home_max_delta_rad: 1.5707963267948966
        joint5_limit_epsilon_rad: 0.001
        # After candidate selection, preserve the chosen branch through
        # approach/pregrasp/grasp and reject a true half-turn jump.
        joint5_stage_continuity: true
        joint5_stage_max_delta_rad: 1.5707963267948966
        max_approach_error_deg: 40.0
        max_closing_error_deg: 30.0
        # LMA is position-only; MoveIt OrientationConstraint did not create an
        # extra DOF and converted useful FK diagnostics into NO_IK_SOLUTION.
        # Keep unconstrained position IK and retain the 40/30 degree FK gate.
        moveit_orientation_search:
          enabled: false
          approach_tolerance_deg: 15.0
          free_rotation_tolerance_deg: 180.0
          constraint_weight: 1.0
          max_attempts: 3
      # Extra offset away from the fixed finger to reduce edge/top-first contact.
      fixed_finger_margin_m: 0.010
      # Narrow targets need more fixed-finger clearance because the fixed jaw cannot sweep the object back.
      fixed_finger_margin_max_m: 0.016
      fixed_finger_margin_width_ref_m: 0.035
      fixed_finger_margin_width_gain: 0.25
      # Reject mirrored grasps that place the fixed jaw on the side away from
      # the robot. The moving jaw then closes from the outer side toward base.
      fixed_finger_base_side:
        enabled: true
        reference_point_base: [0.0, 0.0, 0.0]
        min_alignment_cos: 0.0
        # Reject final IK/FK poses that technically face inward but leave the
        # fixed finger on the target edge. Failed candidate 856 had 0.57 mm;
        # verified marker picks retained at least 10.95 mm.
        min_fk_inward_offset_m: 0.003
      # Before closing, project the measured low-height contact residual onto
      # the closing axis and reject if it erodes too much of the target gap.
      fixed_finger_robust_gap:
        # Disabled: user opted to skip the post-descend fixed-finger crush check
        # and grasp on the first attempt without a rejection/retry cycle.
        enabled: false
        max_target_gap_deficit_m: 0.003
        # Absorb millimetre-scale IK/FK, TF, and servo uncertainty before closing.
        measurement_tolerance_m: 0.001
      width_clearance_m: 0.003
      min_width_m: 0.008
      max_width_m: 0.080
      fallback_width_m: 0.035
      width_quality_min: 0.75

  default_control_mode: "moveit_planning"
  controller_startup_timeout:
    sim: 120.0
    hardware: 30.0

  control_modes:
    teleop:
      description: "Human teleoperation mode for calibration pose setup"
      description_cn: "用于标定姿态设置的人工遥操作模式"
      controllers:
        - joint_state_broadcaster
        - arm_position_controller
        - gripper_position_controller
      inference:
        enabled: false
      executor:
        type: topic
        mode: teleop
        queue_size: 100
        control_frequency: 50.0

    moveit_planning:
      description: "MoveIt trajectory planning mode for hand-eye precheck"
      description_cn: "用于手眼前置检查的 MoveIt 轨迹规划模式"
      controllers:
        - joint_state_broadcaster
        - arm_joint_state_broadcaster
        - arm_trajectory_controller
        - gripper_trajectory_controller
      inactive_controllers:
        - base_velocity_controller
      inference:
        enabled: false
      executor:
        type: action
        mode: moveit_planning
        # Do not skip the initial open command from cached joint feedback.
        skip_redundant_gripper_open: false
        gripper_open_position: 1.0
        gripper_position_tolerance: 0.05
        joint_state_max_age_s: 0.25

    base_navigation:
      description: "Autonomous navigation with MID-360 localization"
      description_cn: "使用 MID-360 定位的自主导航模式"
      controllers:
        - joint_state_broadcaster
        - base_velocity_controller
      inactive_controllers:
        - arm_trajectory_controller
        - gripper_trajectory_controller
      inference:
        enabled: false
      executor:
        type: topic
        mode: base_navigation
        queue_size: 100
        control_frequency: 50.0

  # Navigation is stage-resolved below. The base block is deliberately disabled;
  # a grasp-only launch can still request a low-level bridge explicitly without
  # starting Nav2, SLAM, or the command server.
  navigation:
    enabled: false
    static_tfs: []
    fast_lio:
      enabled: false
      params_file: $(find robot_config)/config/navigation/fast_lio_mid360.yaml
      lidar_topic: /livox/lidar
      imu_topic: /livox/imu
      raw_odom_topic: /fast_lio/odometry_raw
      output_topic: /odometry/filtered
      source_odom_frame: camera_init
      source_body_frame: body
      odom_frame: odom
      base_frame: base_link
      publish_tf: true
      planar_output: false
      max_future_skew_sec: 0.1
      respawn: true
    nav2_bringup:
      enabled: false
      use_amcl: false
      map_file: $(env HOME)/.ros/ibrobot/maps/map.yaml
      params_file: $(find robot_navigation)/config/nav2_params.yaml
    slam_toolbox:
      enabled: false
      executable: async_slam_toolbox_node
      node_name: slam_toolbox
      scan_topic: /scan
      base_frame: base_link
      odom_frame: odom
      map_frame: map
      minimum_travel_distance: 0.05
      minimum_travel_heading: 0.05
      map_update_interval: 1.0
      min_laser_range: 0.10
      max_laser_range: 8.0
    cmd_vel_bridge:
      enabled: false
      publish_odom: false
      publish_tf: false
      wheel_radius: 0.05
      base_radius: 0.125
      max_radps: 4.602
      odom_frame: odom
      base_frame: base_link
      control_frequency: 50.0
      cmd_timeout: 0.5
      cmd_vel_topic: /cmd_vel
      joint_states_topic: /joint_states
      odom_topic: /wheel/odom
    ekf_rtabmap:
      enabled: false
    robot_navigation:
      enabled: false
    rviz:
      enabled: false

  nav_stages:
    grasp:
      name: lekiwi_handeye_realsense_grasp
      default_control_mode: moveit_planning
      skill_required_control_mode: moveit_planning
      mid360_mount_file: ""
      peripheral_names: [respeaker, wrist]
      # The fixed camera is not part of this compatibility stage, so its
      # calibration artifact must not be projected into the wrist-only config.
      sensor_calibration:
        artifacts:
          base_to_front_camera: ""
      # Wrist-only stage: the front camera is absent, so online semantic
      # mapping must stay off and only the two grasp model services are kept.
      semantic_mapping:
        enabled: false
      perception_services:
        services:
          - id: grasp_grounding
            enabled: true
            required: true
            bundle_path: models/grounding_dino_swint_seq8_1280x720
            deployment: ascend_310p
            adapter_class: perception_service.model_service_plugins:GroundingDINORawDetectPlugin
            service_type: ibrobot_msgs/srv/GroundingDetect
            endpoint: /perception/grasp/grounding_detect
            node_name: grasp_grounding_detect
            runtime_options:
              device_id: 0
          - id: grasp_segmentation
            enabled: true
            required: true
            bundle_path: models/sam2.1_hiera_tiny_prompt_ascend
            deployment: ascend_310p
            adapter_class: perception_service.model_service_plugins:SegmentDetectionsPlugin
            service_type: ibrobot_msgs/srv/SegmentDetections
            endpoint: /perception/grasp/segment_detections
            node_name: grasp_segment_detections
            runtime_options:
              device_id: 0
      motion_mode:
        navigation_enabled_on_startup: false
        manipulation_control_mode: moveit_planning
        navigation_control_mode: base_navigation
      embodied:
        enabled: false
        skill_catalog_profile: lekiwi_handeye_realsense_grasp
      navigation:
        enabled: false
        cmd_vel_bridge:
          enabled: false
    mapping:
      default_control_mode: base_navigation
      peripheral_names: [respeaker, front, mid360]
      motion_mode:
        navigation_enabled_on_startup: true
      # Legacy navigation-mapping stage stays lean: online semantic mapping and
      # all model services are off; use the default hybrid stage for mapping.
      semantic_mapping:
        enabled: false
      perception_services:
        services: []
      grasp_execution:
        enabled: false
      placement_execution:
        enabled: false
      contract:
        base_contract: ""
        observations: []
        actions: []
      embodied:
        enabled: false
        skill_catalog_profile: ""
      navigation:
        enabled: true
        fast_lio:
          enabled: true
          planar_output: false
          publish_tf: true
        slam_toolbox:
          enabled: true
        nav2_bringup:
          enabled: false
          use_amcl: false
          dyn_avoid_enabled: false
        cmd_vel_bridge:
          enabled: true
          publish_odom: false
          publish_tf: false
          cmd_vel_topic: /cmd_vel
    navigation:
      default_control_mode: base_navigation
      skill_required_control_mode: base_navigation
      peripheral_names: [respeaker, front, mid360]
      motion_mode:
        navigation_enabled_on_startup: true
      # Legacy localization-navigation stage stays lean: online semantic
      # mapping and all model services are off.
      semantic_mapping:
        enabled: false
      perception_services:
        services: []
      grasp_execution:
        enabled: false
      placement_execution:
        enabled: false
      contract:
        base_contract: ""
        observations: []
        actions: []
      embodied:
        enabled: false
        skill_catalog_profile: ""
        timeouts:
          task_budget_sec: 1200.0
          default_skill_timeout_sec: 300.0
          robot_state_freshness_sec: 0.5
          scene_freshness_sec: 0.5
          model_idle_timeout_sec: 120.0
          rpc_timeout_sec: 15.0
          gripper_settle_sec: 1.5
      navigation:
        enabled: true
        fast_lio:
          enabled: true
          planar_output: true
          publish_tf: true
        slam_toolbox:
          enabled: false
        nav2_bringup:
          enabled: true
          use_amcl: true
          auto_global_localization: true
          dyn_avoid_enabled: true
        command_server:
          enabled: true
          action_name: /navigation/execute
          cancel_service_name: /navigation/cancel_current
          nav2_action_name: /navigate_to_pose
          nav2_result_timeout: 300.0
          stop_velocity_topic: /cmd_vel_safe
          cancel_response_timeout: 2.0
        cmd_vel_bridge:
          enabled: true
          publish_odom: false
          publish_tf: false
          cmd_vel_topic: /cmd_vel_safe
    hybrid:
      default_control_mode: base_navigation
      skill_required_control_mode: moveit_planning
      mid360_mount_file: $(find robot_config)/config/hardware/lekiwi_mid360_mount.yaml
      peripheral_names: [respeaker, wrist, front, mid360]
      motion_mode:
        navigation_enabled_on_startup: true
      control_modes:
        base_navigation:
          controllers:
            - joint_state_broadcaster
            - arm_joint_state_broadcaster
            - base_velocity_controller
      # Online semantic mapping and all six model services (two grasp, four
      # semantic) are inherited from the top level. The default hybrid runtime
      # is query-only until dynamic semantic mapping is explicitly re-enabled.
      semantic_mapping:
        query_only: true
      embodied:
        enabled: true
        skill_catalog_profile: lekiwi_handeye_realsense_grasp_lidar
        timeouts:
          task_budget_sec: 1200.0
          default_skill_timeout_sec: 300.0
          robot_state_freshness_sec: 0.5
          scene_freshness_sec: 0.8
          model_idle_timeout_sec: 120.0
          rpc_timeout_sec: 15.0
          gripper_settle_sec: 1.5
      navigation:
        enabled: true
        fast_lio:
          enabled: true
          planar_output: true
          publish_tf: true
        slam_toolbox:
          enabled: false
        nav2_bringup:
          enabled: true
          use_amcl: true
          auto_global_localization: true
          dyn_avoid_enabled: true
        command_server:
          enabled: true
          action_name: /navigation/execute
          cancel_service_name: /navigation/cancel_current
          nav2_action_name: /navigate_to_pose
          nav2_result_timeout: 300.0
          stop_velocity_topic: /cmd_vel_safe
          cancel_response_timeout: 2.0
        cmd_vel_bridge:
          enabled: true
          publish_odom: false
          publish_tf: false
          cmd_vel_topic: /cmd_vel_safe

  placement_execution:
    enabled: true
    executor: placement_pipeline
    required_args: [target_name, container_name]
    action_name: /manipulation/execute_place
    detect_service: /perception/grasp/grounding_detect
    segment_service: /perception/grasp/segment_detections
    rgb_topic: /camera/wrist/image_raw
    joint_state_topic: /joint_states
    debug_output_root: "$(env WORKSPACE)/outputs/placement_pipeline"
    motion:
      place_pose: place_container
      place_joint_names: ["1", "2", "3", "4", "5"]
      place_joint_positions:
        "1": -0.047553
        "2": -0.073631
        # Joint 3 release pose: raw tick 1500.
        "3": -0.840621
        "4": 1.497165
        "5": -1.570790
      place_duration_sec: 5.0
      post_release:
        # Move only joint 3 to raw tick 1700 before visual verification.
        verify_joint_name: "3"
        verify_joint_position: -0.533825
        verify_duration_sec: 2.0
        return_duration_sec: 2.0
    sensor:
      gripper_feedback_timeout_sec: 1.0
    verification:
      required: true
      confidence_threshold: 0.30
      post_release_wait_sec: 1.0
      max_resamples: 3
      resample_interval_sec: 0.25
      required_confirmations: 2
      min_container_mask_pixels: 500
      min_target_mask_pixels: 100
      min_inside_mask_fraction: 0.70
      container_inset_ratio: 0.05
      # Normalized wrist-camera exclusion for the orange SO-101 gripper.  The
      # polygon is scaled to each incoming RGB frame (640x360 or 1280x720).
      target_exclusion:
        enabled: true
        mask_path: "$(find robot_config)/config/placement_masks/so101_wrist_gripper_sam_mask.png"
        min_detection_overlap: 0.35
        polygons: []

  voice_asr:
    enabled: false
    active_mode: continuous
    language: zh
    bundle_path: "models/voice_asr/sherpa-onnx-streaming-zipformer-zh-14M-2023-02-23"
    deployment: torch_cpu
    max_recording_duration: 10.0
    vad_sensitivity: 0.6
    realtime_pre_roll_seconds: 0.5
    publish_partial: true
    sample_rate: 16000
    chunk_size: 512
    buffer_seconds: 5.0
    output_topic: /voice_command
    exit_on_init_failure: false

  # Start the ReSpeaker direction-of-arrival pipeline with this robot. Common
  # algorithm and microphone-array parameters remain owned by
  # voice_asr_service/config/speech_direction.yaml.
  speech_direction:
    enabled: true
    profile: ascend_310p
    microphone: respeaker
    config_file: "$(find voice_asr_service)/config/speech_direction.yaml"
    profiles_file: "$(find voice_asr_service)/config/speech_direction_profiles.yaml"
    models_root: "$(env WORKSPACE)/models"
    # Runtime overrides are limited to deployment-level values; DSP and model
    # parameters remain owned by voice_asr_service/config/*.yaml.
    parameters:
      mount_yaw_deg: 90.0

  # Ubuntu and openEuler use the same audio_common device owners and ROS topics.
  audio_io:
    enabled: true
    microphone: respeaker
    capture_topic: /audio/capture
    capture_stamped_topic: /audio/capture_stamped
    audio_info_topic: /audio/info
    playback_topic: /audio/play
    playback_sample_rate: 24000
    playback_channels: 1
    playback_sample_format: S16LE

  embodied:
    enabled: false
    entry_mode: hermes
    skill_catalog_source_mode: development
    skill_catalog_source_root: src/skill_catalog
    skill_catalog_profile: lekiwi_handeye_realsense_grasp_lidar
    debug_tracing: true
    idle_behaviors:
      sound_orientation:
        # Disabled until concurrent VoiceASRNode + speech_direction_node access
        # to the deployed ReSpeaker has been validated or a shared capture path
        # is available. The ROS launch integration remains ready for opt-in.
        enabled: false
        trigger_phrases: ["转向我"]
        direction_topic: /voice/speech_direction
        command_topic: /voice_command
        skill_name: nav_turn
        direction_frame: base_link
        deadband_deg: 15.0
        max_direction_age_sec: 1.3
        direction_wait_sec: 0.5
        cooldown_sec: 1.5
        max_turn_deg: 180.0
        turn_timeout_sec: 10.0
        action_acceptance_timeout_sec: 2.0
        status_retry_sec: 0.5
        reset_status_max_age_sec: 2.0
    task_input_topic: /voice_command
    task_command_topic: /embodied/task_command
    planned_task_topic: /embodied/planned_task
    status_topic: /embodied/task_status
    skill_action_name: /embodied/execute_skill
    primitive_action_name: /embodied/execute_primitive
    validate_skill_service: /embodied/validate_skill
    validate_primitive_service: /embodied/validate_primitive
    imitate_human_motion:
      enabled: true
      action_name: /hri/imitate_human_motion
      startup_warmup: true
    default_target_name: ""
    default_place_name: home
    timeouts:
      task_budget_sec: 240.0
      scene_freshness_sec: 0.8
      model_idle_timeout_sec: 120.0
      rpc_timeout_sec: 5.0
      gripper_settle_sec: 1.5
    execution:
      relative_motion_step_m: 0.03
      relative_motion_reference_frame: base
      relative_motion_direction_mapping:
        forward: [0.0, -1.0, 0.0]
        backward: [0.0, 1.0, 0.0]
        left: [1.0, 0.0, 0.0]
        right: [-1.0, 0.0, 0.0]
        up: [0.0, 0.0, 1.0]
        down: [0.0, 0.0, -1.0]
      gripper_open_position: 1.0
      gripper_closed_position: 0.0
      task_executor_action_name: /task_executor/execute_task_plan
      move_configuration_service: /moveit_gateway/move_to_configuration
    safety:
      workspace:
        x: [-0.52, 0.52]
        y: [-0.45, 0.45]
        # Lower bound follows the table height in base frame. The taller base
        # puts the tabletop at z_base = -0.061, so an ee origin grasping at the
        # surface sits at -0.061 + 0.080 = 0.019 and the previous 0.02 floor
        # rejected it outright. 0.0 keeps the same ~16 mm headroom the 0.02
        # floor gave when the table was at -0.044.
        # NOTE: shared by safety_guard, skill_executor, vlm_task_planner and
        # pick_executor via common_params, so this relaxes every primitive.
        z: [0.0, 0.55]
        max_radius_m: 0.52
    named_poses:
      home:
        position: {x: 0.020030733201442157, y: -0.11809839488683391, z: 0.13887055751050842}
        orientation: {x: -0.26790866048257905, y: -0.2622185975709204, z: -0.6525133891660432, w: 0.6585534402654153}
      observe_table:
        position: {x: 0.0, y: -0.18, z: 0.22}
        orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
      zero:
        position: {x: 0.0210077843415008, y: -0.278950111258735, z: 0.24858389783148477}
        orientation: {x: -0.4740206645801369, y: -0.4668084047044082, z: -0.523033090590171, w: 0.532757645647648}

  ros2_control:
    hardware_plugin: lekiwi_hardware/LeKiwiSystemHardware
    port: /dev/ttyACM0
    calib_file: $(env HOME)/.calibrate/so101_follower_calibrate.json
    # Arm + gripper joints driven as position (matches the SO101 stack).
    joint_names: ["1", "2", "3", "4", "5", "6"]
    # Omni base wheel joints driven as velocity (LeKiwi-only).
    velocity_joints: ["7", "8", "9"]
    # Max base velocity in rad/s; matches base_vel_max_raw=3000 of STS3215.
    base_vel_max_rad: 4.602
    # Semantic rest pose for upper layers; hardware activation holds the measured position.
    reset_positions:
      "1": 0.0
      "2": -1.5854
      "3": 1.5708
      "4": 0.7854
      "5": 0.0
    urdf_path: $(find lekiwi_description)/urdf/lekiwi_assembled.urdf.xacro
    controllers_config: $(find lekiwi_hardware)/config/lekiwi_controllers.yaml
    controllers:
      - joint_state_broadcaster
      - arm_joint_state_broadcaster
      - arm_trajectory_controller
      - gripper_trajectory_controller
      - base_velocity_controller

  peripherals:
    - type: microphone
      name: respeaker
      driver: alsa
      params:
        device: "hw:0,0"
        channels: 6
        sample_rate: 16000
        sample_format: S16LE
        channel_indices: [1, 2, 3, 4]

    - type: camera
      name: wrist
      driver: realsense
      # Device-specific serials belong in a deployment instance override.
      # Leave the generic profile empty so other LeKiwi units can bind safely.
      serial_number: ""
      # The 310P Color-first wrapper provides deterministic sensor ordering;
      # resetting here only changes timing and can make device selection flaky.
      initial_reset: false
      # 640x360 preserves the existing 16:9 contract shape while keeping
      # aligned RGB-D processing at 30 Hz on 310P.
      width: 640
      height: 360
      fps: 30
      pixel_format: bgr8
      # Grasp planning needs depth in RGB pixel coordinates. Keep alignment as
      # the one pipeline-specific feature enabled after the raw RGB-D baseline.
      align_depth: true
      # The planner builds its scene cloud from aligned depth, so the driver
      # pointcloud and hardware sync paths are unnecessary additional load.
      enable_sync: false
      enable_pointcloud: false
      enable_gyro: false
      enable_accel: false
      streams:
        - color
        - depth
      frame_id: camera_wrist_link
      optical_frame_id: camera_wrist_optical_frame
      # Reused from the PC-validated eye-in-hand runtime configuration. This
      # extrinsic remains valid when the unchanged camera mount moves to 310P.
      # Updated from outputs/handeye/wrist_handeye_new.json (method=park,
      # ee_to_camera_link, reproj_mean=0.437px, rot_rms=4.85deg).
      transform:
        parent_frame: gripper
        x: -0.029804122099556248
        y: 0.0735813073058911
        z: -0.03849247926512127
        roll: 3.093836835932143
        pitch: 1.0039505938496505
        yaw: -1.6776874824436123

    - type: camera
      name: front
      driver: realsense
      driver_camera_name: front
      # Device-specific serials belong in a deployment instance override.
      serial_number: ""
      width: 640
      height: 480
      fps: 30
      color_format: RGB8
      depth_format: Z16
      streams: [color, depth]
      align_depth: true
      enable_sync: true
      initial_reset: false
      enable_pointcloud: false
      frame_id: camera_front_link
      optical_frame_id: camera_front_optical_frame
      # Images remain available without the artifact, but no placeholder mount
      # is published until an approved base-to-camera calibration is installed.
      skip_urdf_without_transform: true
      transform:
        parent_frame: base_link
        x: 0.0
        y: 0.0
        z: 0.0
        roll: 0.0
        pitch: 0.0
        yaw: 0.0

    - type: lidar
      name: mid360
      driver: livox_mid360
      frame_id: livox_frame
      lidar_ip: 192.168.1.139
      host_ip: 192.168.1.5
      pointcloud_topic: /livox/lidar
      imu_topic: /livox/imu
      user_config_path: $(find livox_ros_driver2)/config/MID360_config.json
      xfer_format: 1
      multi_topic: 0
      data_src: 0
      publish_freq: 10.0
      output_data_type: 0
      cmdline_input_bd_code: livox0000000001
      respawn: true
      scan_converter:
        enabled: true
        queue_size: 1
        pointcloud_topic: /cloud_registered_body
        scan_topic: /scan
        target_frame: body
        transform_tolerance: 0.01
        min_height: -0.05
        max_height: 0.50
        angle_min: -3.14159265
        angle_max: 3.14159265
        angle_increment: 0.00872665
        scan_time: 0.10
        range_min: 0.10
        range_max: 8.0
        use_inf: true
        inf_epsilon: 1.0
        respawn: true

  contract:
    base_contract: $(find robot_config)/config/contracts/act_grab_pan.yaml
    rate_hz: 20
    max_duration_s: 90.0

    observations:
      - key: observation.images.wrist
        topic: /camera/wrist/image_raw
        type: sensor_msgs/msg/Image
        peripheral: wrist
        image:
          resize: [720, 1280]
        align:
          strategy: hold
          stamp: header
          tol_ms: 1500
        qos:
          reliability: best_effort
          history: keep_last
          depth: 10

      - key: observation.images.wrist.depth
        topic: /camera/wrist/aligned_depth_to_color/image_raw
        type: sensor_msgs/msg/Image
        peripheral: wrist
        image:
          resize: [720, 1280]
        align:
          strategy: hold
          stamp: header
          tol_ms: 1500
        qos:
          reliability: best_effort
          history: keep_last
          depth: 10

      - key: observation.state
        topic: /joint_states
        type: sensor_msgs/msg/JointState
        selector:
          names:
            - "position.1"
            - "position.2"
            - "position.3"
            - "position.4"
            - "position.5"
            - "position.6"
        align:
          strategy: hold
          stamp: header
          tol_ms: 1500
        qos:
          reliability: best_effort
          history: keep_last
          depth: 50

    actions:
      - key: action
        selector:
          names:
            - "action.0"
            - "action.1"
            - "action.2"
            - "action.3"
            - "action.4"
        publish:
          topic: /arm_position_controller/commands
          type: std_msgs/msg/Float64MultiArray
          layout: flat
          qos:
            reliability: best_effort
            history: keep_last
            depth: 10
          strategy:
            mode: nearest
