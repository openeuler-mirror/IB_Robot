# Unified LeKiwi MID-360 configuration on the LeKiwi runtime.
#
# Chassis geometry, wheel odometry, navigation gating, controller activation
# and the sensor surface live in the runtime profile
# (lekiwi_robot/profiles/lekiwi_lidar.yaml); this file selects the runtime and
# declares application policy only (navigation stages, SLAM/Nav2 tuning,
# skill profiles, recording). Base commands are admitted on the contract
# /cmd_vel channel once the base_navigation mode is active and the navigation
# gate is open; stages that drive the base from boot declare
# navigation.open_gate_on_startup, which a launch-time admission step applies
# through the contract gate service after the runtime is ready.
robot:
  name: lekiwi_lidar
  type: lekiwi
  robot_type: lekiwi

  runtime:
    provider: lekiwi_robot
    profile: lekiwi_lidar
    # require_model stays unset: this configuration is loaded by offline tools
    # (recording, capture, catalog) that have no live runtime to bind against;
    # the require_model flag would force deferred live binding on every load.
    # The loader still rejects runtime-owned restatements under the provider,
    # and the profile owns every hardware fact.

  default_nav_stage: navigation
  default_control_mode: teleop
  mid360_mount_file: $(find lekiwi_description)/config/lekiwi_mid360_mount.yaml

  joints:
    base: ["7", "8", "9"]
    all: ["7", "8", "9"]

  control_modes:
    teleop:
      description: "Base control with MID-360 localization"
      description_cn: "使用 MID-360 定位的底盘控制模式"
      # Both base-driving modes select the runtime's base_navigation mode;
      # they differ only in executor policy.
      runtime_mode: base_navigation
      inference:
        enabled: false
      executor:
        type: topic
        mode: teleop
        queue_size: 100
        control_frequency: 50.0
    base_navigation:
      description: "Autonomous navigation with MID-360 localization"
      description_cn: "使用 MID-360 定位的自主导航模式"
      runtime_mode: base_navigation
      inference:
        enabled: false
      executor:
        type: topic
        mode: base_navigation
        queue_size: 100
        control_frequency: 50.0

  teleoperation:
    enabled: true
    # Base gamepad on the runtime's /cmd_vel channel (joy_teleop). Set
    # active_device to lekiwi_gamepad on the host the gamepad is attached to;
    # the launch then checks the mapping against the runtime's bound base.cmd_vel
    # limits. In stages that run the Nav2 collision monitor this input is not
    # collision-filtered; the B button calls /runtime/stop.
    active_device: ""
    devices:
      - name: "lekiwi_gamepad"
        type: "joy_teleop"
        input_device: "/dev/input/js0"
        deadzone: 0.1
        autorepeat_rate: 20.0
        sticky_buttons: false
        config_path: "$(find robot_config)/config/lekiwi/lekiwi_gamepad_base.yaml"

  simulation:
    platform: sdk
    scene: null

  navigation:
    enabled: false
    static_tfs: []
    # FAST-LIO wiring is application-side data for the generic builder; under
    # the runtime provider the stage policy (enabled/planar_output) is handed
    # to the runtime as the deployment fragment and merges over the profile's
    # identical chain.
    fast_lio:
      enabled: false
      params_file: $(find robot_config)/config/navigation/fast_lio_mid360.yaml
      lidar_topic: /livox/lidar
      imu_topic: /livox/imu
      raw_odom_topic: /fast_lio/odometry_raw
      output_topic: /odometry/filtered
      source_odom_frame: camera_init
      source_body_frame: body
      odom_frame: odom
      base_frame: base_link
      publish_tf: true
      planar_output: false
      max_future_skew_sec: 0.1
      respawn: true
    nav2_bringup:
      enabled: false
      use_amcl: false
      map_file: $(env HOME)/.ros/ibrobot/maps/map.yaml
      params_file: $(find robot_navigation)/config/nav2_params.yaml
    slam_toolbox:
      enabled: false
      executable: async_slam_toolbox_node
      node_name: slam_toolbox
      scan_topic: /scan
      base_frame: base_link
      odom_frame: odom
      map_frame: map
      minimum_travel_distance: 0.05
      minimum_travel_heading: 0.05
      map_update_interval: 1.0
      min_laser_range: 0.10
      max_laser_range: 8.0

  nav_stages:
    mapping:
      navigation:
        enabled: true
        open_gate_on_startup: true
        fast_lio:
          enabled: true
          planar_output: false
        slam_toolbox:
          enabled: true
        nav2_bringup:
          enabled: false
          use_amcl: false
          dyn_avoid_enabled: false
    navigation:
      default_control_mode: base_navigation
      skill_required_control_mode: base_navigation
      embodied:
        enabled: false
        entry_mode: hermes
        skill_catalog_source_mode: development
        skill_catalog_profile: lekiwi_lidar
        skill_action_name: /embodied/execute_skill
        primitive_action_name: /embodied/execute_primitive
        validate_skill_service: /embodied/validate_skill
        validate_primitive_service: /embodied/validate_primitive
        skill_gateway_status_service: /embodied/get_skill_gateway_status
        timeouts:
          task_budget_sec: 360.0
          default_skill_timeout_sec: 300.0
          robot_state_freshness_sec: 0.5
          scene_freshness_sec: 0.5
          model_idle_timeout_sec: 120.0
          rpc_timeout_sec: 15.0
          gripper_settle_sec: 1.5
      navigation:
        enabled: true
        open_gate_on_startup: true
        fast_lio:
          enabled: true
          planar_output: true
        slam_toolbox:
          enabled: false
        nav2_bringup:
          enabled: true
          use_amcl: true
          auto_global_localization: true
          dyn_avoid_enabled: true
        command_server:
          enabled: true
          action_name: /navigation/execute
          cancel_service_name: /navigation/cancel_current
          nav2_action_name: /navigate_to_pose
          nav2_result_timeout: 300.0
          # Stops reach the base through the same admitted /cmd_vel channel
          # as the planner (collision-monitor output under dyn_avoid).
          stop_velocity_topic: /cmd_vel
          cancel_response_timeout: 2.0
