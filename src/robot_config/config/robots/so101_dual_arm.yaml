# SO-101 Dual Arm Robot Configuration
# Dual hardware instances defined in single URDF (Multi-Hardware Standard)
# Uses generic 'xacro_args' to map physical ports to URDF args (port_1, port_2)

robot:
  name: so101_dual_arm
  type: so101_dual
  robot_type: aloha

  # Unified joint definitions
  joints:
    left_arm: ["joint1_left", "joint2_left", "joint3_left", "joint4_left", "joint5_left"]
    left_gripper: ["joint6_left"]
    right_arm: ["joint1_right", "joint2_right", "joint3_right", "joint4_right", "joint5_right"]
    right_gripper: ["joint6_right"]
    # Provide standard keys expected by loader.py
    arm: ["joint1_left", "joint2_left", "joint3_left", "joint4_left", "joint5_left"]
    gripper: ["joint6_left"]
    all: ["joint1_left", "joint2_left", "joint3_left", "joint4_left", "joint5_left", "joint6_left", "joint1_right", "joint2_right", "joint3_right", "joint4_right", "joint5_right", "joint6_right"]

  default_control_mode: "teleop"

  control_modes:
    teleop:
      description: "Bimanual teleoperation mode"
      controllers:
        - arm_position_controller_left
        - gripper_position_controller_left
        - arm_position_controller_right
        - gripper_position_controller_right
        - joint_state_broadcaster
      inference:
        enabled: false
      executor:
        type: topic
        mode: teleop
        queue_size: 100
        control_frequency: 50.0

    model_inference:
      description: "Bimanual inference mode"
      controllers:
        - arm_position_controller_left
        - gripper_position_controller_left
        - arm_position_controller_right
        - gripper_position_controller_right
        - joint_state_broadcaster
      inference:
        enabled: true
        pipelines:
          bimanual_policy:
            model_path: models/dual_arm/pretrained_model
            deployment: cpu
            execution_mode: distributed
            request_timeout: 10.0
      executor:
        type: topic
        mode: model_inference
        inference_pipeline: bimanual_policy
        control_frequency: 30.0
        watermark_threshold: 40
        min_queue_size: 0

  # Single ros2_control entry for Multi-Hardware
  ros2_control:
    hardware_plugin: so101_hardware/SO101SystemHardware
    urdf_path: $(find so101_description)/urdf/lerobot/so101/so101_dual.urdf.xacro
    controllers_config: $(find so101_hardware)/config/so101_dual_controllers.yaml
    # Generic mapping: inject these directly into URDF xacro args
    xacro_args:
      port_1: /dev/ttyACM0
      calib_file_left: $(env HOME)/.calibrate/so101_follower_left_calibrate.json
      port_2: /dev/ttyACM1
      calib_file_right: $(env HOME)/.calibrate/so101_follower_right_calibrate.json

    controllers:
      - arm_position_controller_left
      - gripper_position_controller_left
      - arm_position_controller_right
      - gripper_position_controller_right
      - joint_state_broadcaster

  # Teleoperation (Bimanual Leader)
  teleoperation:
    enabled: true
    active_devices:
      - "left_leader"
      - "right_leader"
    devices:
      - name: "left_leader"
        type: "leader_arm"
        port: "/dev/ttyACM2"
        calib_file: "$(env HOME)/.calibrate/so101_leader_left_calibrate.json"
        joint_mapping:
          "1": "joint1_left"
          "2": "joint2_left"
          "3": "joint3_left"
          "4": "joint4_left"
          "5": "joint5_left"
          "6": "joint6_left"
        target:
          arm_joint_names: ["joint1_left", "joint2_left", "joint3_left", "joint4_left", "joint5_left"]
          gripper_joint_names: ["joint6_left"]
          arm_command_topic: "/arm_position_controller_left/commands"
          gripper_command_topic: "/gripper_position_controller_left/commands"
      - name: "right_leader"
        type: "leader_arm"
        port: "/dev/ttyACM3"
        calib_file: "$(env HOME)/.calibrate/so101_leader_right_calibrate.json"
        joint_mapping:
          "1": "joint1_right"
          "2": "joint2_right"
          "3": "joint3_right"
          "4": "joint4_right"
          "5": "joint5_right"
          "6": "joint6_right"
        target:
          arm_joint_names: ["joint1_right", "joint2_right", "joint3_right", "joint4_right", "joint5_right"]
          gripper_joint_names: ["joint6_right"]
          arm_command_topic: "/arm_position_controller_right/commands"
          gripper_command_topic: "/gripper_position_controller_right/commands"

  # Peripheral devices (cameras)
  peripherals:
    - type: camera
      name: top
      driver: opencv
      index: 2
      width: 320
      height: 240
      fps: 60
      pixel_format: mjpeg2rgb
      frame_id: camera_top_frame
      optical_frame_id: camera_top_optical_frame
      use_default_transform: false
      transform:
        parent_frame: base_link
        x: 0.0
        y: 0.0
        z: 0.0
        roll: 0.0
        pitch: 0.0
        yaw: 0.0
      fovy: 0
    - type: camera
      name: left_wrist
      driver: opencv
      index: 0
      width: 320
      height: 240
      fps: 60
      pixel_format: mjpeg2rgb
      frame_id: camera_left_wrist_frame
      optical_frame_id: camera_left_wrist_optical_frame
      use_default_transform: false
      transform:
        parent_frame: gripper_left
        x: 0.0
        y: 0.0
        z: 0.0
        roll: 0.0
        pitch: 0.0
        yaw: 0.0
      fovy: 0
    - type: camera
      name: right_wrist
      driver: opencv
      index: 4
      width: 320
      height: 240
      fps: 60
      pixel_format: mjpeg2rgb
      frame_id: camera_right_wrist_frame
      optical_frame_id: camera_right_wrist_optical_frame
      use_default_transform: false
      transform:
        parent_frame: gripper_right
        x: 0.0
        y: 0.0
        z: 0.0
        roll: 0.0
        pitch: 0.0
        yaw: 0.0
      fovy: 0

  safety:
    joint_limits:
      "joint1_left":  {"min": -2.0693, "max": 2.0709}
      "joint2_left":  {"min": -1.92,   "max": 1.92}
      "joint3_left":  {"min": -1.6813, "max": 1.6828}
      "joint4_left":  {"min": -1.65806, "max": 1.65806}
      "joint5_left":  {"min": -2.9115, "max": 2.9115}
      "joint6_left":  {"min": 0.0,     "max": 1.0}
      "joint1_right": {"min": -2.0693, "max": 2.0709}
      "joint2_right": {"min": -1.92,   "max": 1.92}
      "joint3_right": {"min": -1.6813, "max": 1.6828}
      "joint4_right": {"min": -1.65806, "max": 1.65806}
      "joint5_right": {"min": -2.9115, "max": 2.9115}
      "joint6_right": {"min": 0.0,     "max": 1.0}

  # Contract: defines observation-action interface for recording & inference
  contract:
    rate_hz: 20
    max_duration_s: 120.0
    observations:
      - key: observation.images.top
        topic: /camera/top/image_raw
        type: sensor_msgs/msg/Image
        peripheral: top
        image:
          resize: [240, 320]
        align:
          strategy: hold
          stamp: header
          tol_ms: 1500
        qos:
          reliability: best_effort
          history: keep_last
          depth: 10
      - key: observation.images.left
        topic: /camera/left_wrist/image_raw
        type: sensor_msgs/msg/Image
        peripheral: left_wrist
        image:
          resize: [240, 320]
        align:
          strategy: hold
          stamp: header
          tol_ms: 1500
        qos:
          reliability: best_effort
          history: keep_last
          depth: 10
      - key: observation.images.right
        topic: /camera/right_wrist/image_raw
        type: sensor_msgs/msg/Image
        peripheral: right_wrist
        image:
          resize: [240, 320]
        align:
          strategy: hold
          stamp: header
          tol_ms: 1500
        qos:
          reliability: best_effort
          history: keep_last
          depth: 10
      - key: observation.state
        topic: /joint_states
        type: sensor_msgs/msg/JointState
        selector:
          names:
            - "position.joint1_left"
            - "position.joint2_left"
            - "position.joint3_left"
            - "position.joint4_left"
            - "position.joint5_left"
            - "position.joint6_left"
            - "position.joint1_right"
            - "position.joint2_right"
            - "position.joint3_right"
            - "position.joint4_right"
            - "position.joint5_right"
            - "position.joint6_right"
        align:
          strategy: hold
          stamp: header
          tol_ms: 1500
        qos:
          reliability: best_effort
          history: keep_last
          depth: 50
    actions:
      - key: action
        selector:
          names:
            - "action.0"   # joint1_left
            - "action.1"   # joint2_left
            - "action.2"   # joint3_left
            - "action.3"   # joint4_left
            - "action.4"   # joint5_left
        publish:
          topic: /arm_position_controller_left/commands
          type: std_msgs/msg/Float64MultiArray
          layout: flat
          qos:
            reliability: best_effort
            history: keep_last
            depth: 10
          strategy:
            mode: nearest
            tolerance_ms: 500
        safety_behavior: hold
      - key: action
        selector:
          names:
            - "action.5"   # joint6_left
        publish:
          topic: /gripper_position_controller_left/commands
          type: std_msgs/msg/Float64MultiArray
          layout: flat
          qos:
            reliability: best_effort
            history: keep_last
            depth: 10
          strategy:
            mode: nearest
            tolerance_ms: 500
        safety_behavior: hold
      - key: action
        selector:
          names:
            - "action.6"   # joint1_right
            - "action.7"   # joint2_right
            - "action.8"   # joint3_right
            - "action.9"   # joint4_right
            - "action.10"  # joint5_right
        publish:
          topic: /arm_position_controller_right/commands
          type: std_msgs/msg/Float64MultiArray
          layout: flat
          qos:
            reliability: best_effort
            history: keep_last
            depth: 10
          strategy:
            mode: nearest
            tolerance_ms: 500
        safety_behavior: hold
      - key: action
        selector:
          names:
            - "action.11"  # joint6_right
        publish:
          topic: /gripper_position_controller_right/commands
          type: std_msgs/msg/Float64MultiArray
          layout: flat
          qos:
            reliability: best_effort
            history: keep_last
            depth: 10
          strategy:
            mode: nearest
            tolerance_ms: 500
        safety_behavior: hold

  recording:
    bag_base_dir: "~/rosbag/episodes"
    storage: mcap
