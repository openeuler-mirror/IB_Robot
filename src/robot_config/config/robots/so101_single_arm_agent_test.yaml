# SO-101 Agent incubation overlay.  The base YAML remains the single source of
# truth for joints, controllers, MoveIt, workspace and skill catalog settings.
robot:
  name: so101_single_arm
  base_config: so101_single_arm.yaml
  embodied:
    enabled: true
    entry_mode: agent
    agent:
      enabled: true
      incubation: true
      execution_enabled: false
      request_topic: /agent/request
      event_topic: /agent/event
      response_topic: /agent/response
      control_topic: /agent/control
      channel_id: agent_cli
      principal_id: local_operator
      planner:
        mode: rule
      test_allowlist:
        - open_gripper_skill
        - close_gripper_skill
        - recover_safe_pose
        - recover_zero_pose
        - nod_yes
        - shake_no
        - wave_hello
      ledger_path: /tmp/ibrobot-agent-so101-test/requests.sqlite3
      conversation_path: /tmp/ibrobot-agent-so101-test/conversation.sqlite3
      deployment_lock_path: /tmp/ibrobot-agent-so101-test/agent.lock
      max_session_turns: 12
      clarification_ttl_sec: 300.0
      event_queue_size: 128

  # Agent incubation is text-only. Do not initialize microphone or TTS model
  # runtimes while validating the no-motion/Gazebo control path.
  audio_io:
    enabled: false
  voice_tts:
    enabled: false
