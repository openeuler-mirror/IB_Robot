# LeKiwi fixed-D435 semantic mapping on a teleoperated base.
#
# UNSUPPORTED for base drive (openspec lekiwi-application-migration task
# 1.5, design A5): the generic cmd_vel bridge was removed, so this
# provider-less configuration has no base velocity path. Online
# semantic mapping is maintained on the lekiwi_nav_grasp hybrid stage
# (front camera + MID-360 on the LeKiwi runtime); this configuration
# remains loadable as a fixture for the semantic_mapping package's own
# launches and tests.
robot:
  name: lekiwi_realsense_mapping
  type: lekiwi
  robot_type: lekiwi

  joints:
    base:
      - "7"
      - "8"
      - "9"
    all: ["7", "8", "9"]

  default_control_mode: "teleop"

  control_modes:
    teleop:
      description: "Base-only teleoperation mode for fixed D435 semantic mapping"
      description_cn: "用于固定安装 D435 语义建图的仅底盘遥操作模式"
      controllers:
        - joint_state_broadcaster
        - base_velocity_controller
      inference:
        enabled: false
      executor:
        type: topic
        mode: teleop
        queue_size: 100
        control_frequency: 50.0

  simulation:
    platform: gazebo
    scene: null

  ros2_control:
    hardware_plugin: lekiwi_hardware/LeKiwiSystemHardware
    port: /dev/ttyACM0
    velocity_joints: ["7", "8", "9"]
    base_vel_max_rad: 4.602
    urdf_path: $(find lekiwi_description)/urdf/lekiwi_assembled.urdf.xacro
    controllers_config: $(find lekiwi_hardware)/config/lekiwi_base_controllers.yaml
    xacro_mappings:
      base_only: true

  peripherals:
    - type: camera
      name: realsense
      driver: realsense
      driver_camera_name: realsense_camera
      serial_number: ""
      width: 848
      height: 480
      fps: 30
      pixel_format: bgr8
      enable_pointcloud: false
      align_depth: true
      enable_sync: true
      frame_id: camera_link
      optical_frame_id: camera_color_optical_frame
      transform:
        parent_frame: base_link
        x: 0.0
        y: 0.0
        z: 0.3
        roll: 0.0
        pitch: 0.0
        yaw: 0.0

  navigation:
    enabled: true

    nav2_bringup:
      enabled: false

    ekf_rtabmap:
      enabled: true
      rtabmap:
        database_path: "$(env HOME)/.ros/ibrobot/maps/rtabmap.db"
        localization: false
        visual_odometry: false
        frame_id: camera_link
        odom_frame_id: odom
        odom_topic: /odom
        rgb_topic: /camera/realsense/image_raw
        depth_topic: /camera/realsense/depth/image_rect_raw
        camera_info_topic: /camera/realsense/camera_info
        approx_sync: true
        queue_size: 20
        qos_image: 2
        qos_camera_info: 2
        qos_odom: 2
        rtabmap_args: "--delete_db_on_start --Mem/InitWMWithAllNodes true --Mem/IncrementalMemory true --Mem/PermanentMemory false --Mem/STMSize 8"
        log_level: info
      ekf:
        enabled: false
        config_file: ""

    # No cmd_vel_bridge: the generic bridge was removed (task 2.2) and this
    # configuration is unsupported for base drive (see the header).

    robot_navigation:
      enabled: false

    funasr:
      host: "127.0.0.1"
      port: "10095"
      mode: "2pass"
      hotword_msg: ""

    rviz:
      enabled: false

  # Disabled templates keep this checked-in config loadable without production bundles.
  perception_services:
    services:
      - id: semantic_sam2_masks
        enabled: false
        required: false
      - id: semantic_ram_plus_tags
        enabled: false
        required: false
      - id: semantic_siglip2_image
        enabled: false
        required: false
      - id: semantic_siglip2_text
        enabled: false
        required: false
      - id: semantic_gdino_confirmation
        enabled: false
        required: false
      # GraspGen is a perception model like the five above: one typed endpoint over one
      # named deployment. It is not bound to a semantic_mapping role - manipulation calls
      # GenerateGrasps directly with a segmented object cloud.
      - id: semantic_graspgen_grasps
        enabled: false
        required: false

  semantic_mapping:
    enabled: false
    camera:
      peripheral: realsense
      mounting: fixed
      parent_frame: base_link
      rgb_topic: /camera/realsense/image_raw
      depth_topic: /camera/realsense/aligned_depth_to_color/image_raw
      camera_info_topic: /camera/realsense/camera_info
    slam:
      # Replace these identities with values exported by the active SLAM,
      # calibration, and robot-description deployments before enabling mapping.
      global_frame: map
      cloud_map_topic: /cloud_registered_body
      active_map_hash_topic: /slam/active_geometry_map_hash
      localization_ready_topic: /slam/localization_ready
      authoritative_map_odom_topic: /slam/authoritative_map_odom_ready
      geometry_map_id: rtabmap-lekiwi
      geometry_map_hash: REPLACE_WITH_ACTIVE_GEOMETRY_MAP_HASH
      localization_session_id: REPLACE_WITH_LOCALIZATION_SESSION_ID
      calibration_id: REPLACE_WITH_D435_CALIBRATION_HASH
      urdf_hash: REPLACE_WITH_ACTIVE_URDF_HASH
      coordinate_convention: ros-rep-103-map-enu
      map_odom_authority: slam
    perception:
      mapping_backend: service
      service_wait_sec: 1.0
      semantic_roles:
        sam2_masks: semantic_sam2_masks
        ram_plus_tags: semantic_ram_plus_tags
        siglip2_image: semantic_siglip2_image
        siglip2_text: semantic_siglip2_text
        gdino_confirmation: semantic_gdino_confirmation
      allow_legacy_embedded: false
    persistence:
      database_path: ~/.ros/ibrobot/semantic_map.sqlite3
      artifact_output_dir: ~/.ros/ibrobot/semantic_artifacts
    filtering:
      depth_trunc_m: 4.0
      min_points: 30
      min_frame_valid_depth_ratio: 0.05
      min_mask_pixels: 300
      min_mask_area_ratio: 0.001
      min_mask_valid_depth_ratio: 0.2
      max_mask_overlap_ratio: 0.8
      ground_filter_enabled: true
      ground_reference_frame: base_link
      ground_height_offset_m: 0.0
      ground_max_bottom_clearance_m: 0.15
      ground_max_object_height_m: 0.75
      ground_max_footprint_m: 1.2
      # Robust 3D AABB edge limit for rejecting scene-scale SAM masks.
      max_object_extent_m: 0.65
      max_object_distance_m: 2.5
    queue:
      sync_queue_size: 10
      sync_slop_sec: 0.06
      tf_timeout_sec: 0.15
      processing_interval_sec: 0.5
      frame_capacity: 2
      policy: drop_oldest
      max_masks_per_frame: 32
      max_masks_per_batch: 8
    lifecycle:
      association_distance_m: 0.45
      association_max_size_ratio: 4.0
      association_position_weight: 0.55
      embedding_similarity_threshold: 0.72
      label_switch_confidence_margin: 0.05
      stale_after_sec: 10.0
      move_stability_m: 0.1
      move_confirmations: 2
    labels:
      min_confidence: 0.2
      max_candidates_per_mask: 5
      recurrence_count_ratio: 3.0
      high_confidence_override_margin: 0.08
      excluded_labels:
        # Scene background, generic concepts, shapes, and action-like RAM++ noise.
        - animal
        - attach
        - bite
        - bomb
        - briefcase
        - building
        - candle
        - cloud
        - cloudy
        - cloth
        - color
        - container
        - cube
        - cylinder
        - draw
        - drive
        - eagle
        - face
        - fighter jet
        - fly
        - floor
        - food
        - foot
        - fruit
        - gun
        - hang
        - hand
        - hay
        - hot
        - image
        - iceberg
        - jet
        - line
        - liquid
        - man
        - missile
        - move
        - oval
        - person
        - photo
        - polygon
        - plastic
        - plane
        - pole
        - rectangle
        - reflection
        - room
        - shape
        - sheet
        - sign
        - sky
        - square
        - stack
        - stop sign
        - stop light
        - street sign
        - tear
        - tie
        - toothpaste
        - traffic light
        - triangle
        - unlabeled
        - water
        - wind
    label_refinement:
      enabled: false
      model: gpt-5.6-sol
      model_identity: xunxing/gpt-5.6-sol@az.gptplus5.com
      prompt: >-
        The left panel is the full indoor office/laboratory scene with the target highlighted in green and boxed in
        red. The right panel is an enlarged masked crop of that target. Identify exactly one concrete, physically
        manipulable item plausible in a robotics laboratory. Use the most specific common object noun supported by
        the image. Prefer banana over food or fruit, trash can or bin over container or plastic, crumpled paper over
        paper or cloth, and marker over cylinder. Never answer with a material, shape, color, visual attribute,
        action, scene/background, or broad parent category. RAM++ candidates are weak hints and may all be wrong.
      min_confidence: 0.8
      trigger_below_confidence: 0.7
      min_observations: 1
    target_watch:
      max_attempts: 3
      scan_profile: fixed_d435_base_scan
      stand_off_distance_m: 0.8
      clearance_m: 0.2
      track_state_updates_enabled: true
      track_state_topic: /object_tracker/track_state
      track_state_frame: odom
      track_state_max_age_sec: 1.0
      track_state_max_covariance_m2: 0.25
      track_state_confirmation_gap_sec: 1.0
      track_state_persist_interval_sec: 1.0
      footprint_ready_topic: /navigation/footprint_ready
      obstacle_map_ready_topic: /navigation/obstacle_map_ready
      reachability_ready_topic: /navigation/reachability_ready
    interfaces:
      semantic_map_topic: /semantic_mapping/objects
      object_cloud_topic: /semantic_mapping/object_cloud
      query_service: /semantic_mapping/get_objects
      target_service: /semantic_mapping/resolve_target
    migration:
      grounded_sam2_node: compatibility
      grounded_sam2_snapshot: diagnostic_only
      perception_service_node: general_scene
      embedded_mapping_backend: disabled
