# Scene: pick_banana
# Task: Pick the banana from the table and place it on the plate.
#
# All positions/rotations match the MuJoCo MJCF (so101_full_scene.xml) so both
# Gazebo and MuJoCo simulations start from an identical world state.
# T7 reads this file to define task success criteria and object references.

scene_name: pick_banana
description: "Table-top scene with banana and plate for pick-and-place task"

# Robot spawn position for this scene.
# The table surface is at z=0; the so101 URDF base_link origin sits ~3cm above the
# physical table contact point, so we lower the spawn by 0.03m to align visually.
# gazebo_adapter reads this and overrides initial_pose_z when the scene is loaded.
robot_spawn:
  x: 0.0
  y: 0.30
  z: -0.03

objects:
  - name: bluetable
    type: static_mesh
    gazebo_mesh: bluetable.obj
    mujoco_mesh: bluetable.obj
    mesh_scale: 0.156
    position: [0.0, 0.0, -0.321]
    rotation_euler_rad: [1.5708, 0.0, 0.0]
    description: "Blue table providing the work surface (visual only)"

  - name: green_curten
    type: static_mesh
    gazebo_mesh: greencurten.obj
    mujoco_mesh: greencurten_mj.obj
    mesh_scale: 0.15
    position: [0.0, -0.345, 0.0]
    rotation_euler_rad: [1.5708, 0.0, 3.14159]
    description: "Green curtain background (visual only)"

  - name: plate
    type: dynamic
    gazebo_mesh: plate.obj
    mujoco_mesh: plate.obj
    mesh_scale: 0.08
    position: [0.22, 0.02, 0.02]
    rotation_euler_rad: [1.5708, 0.0, 0.0]
    mass_kg: 0.2
    description: "White plate — target for banana placement"

  - name: banana
    type: dynamic
    gazebo_mesh: banana.obj
    mujoco_mesh: banana_mj.obj
    mesh_scale: 0.012
    position: [0.0, 0.02, 0.05]
    rotation_euler_rad: [0.0, 0.0, 0.0]
    mass_kg: 0.1
    description: "Yellow banana — object to be grasped"

# ── Scene task declaration ────────────────────────────────────────────────────
# The world owner (generic launch) starts this executable after runtime
# readiness on every platform listed here (so101-mujoco-runtime-platform D8).
task:
  executable: pick_banana_task_node
  platforms: [mujoco, gazebo]

# ── Evaluation criteria (shared by every physics platform, D9) ───────────────
# The plate centre is derived from objects[plate].position; these radii are
# the success / flew-out / fell-off limits the AutoTest judges with. A scene
# without this section uses the same values as defaults.
evaluation:
  success_radius_m: 0.15
  flew_out_radius_m: 0.40
  fell_off_z: -0.05

# ── Randomisation config (shared placement generator, issue #195) ─────────────
# scene_compiler.randomization_placements turns this into the single placement
# list both platforms index: the MuJoCo backend applies placements[k] through
# ResetWorld state overrides, the Gazebo backend through SetEntityPose.
# mode: grid (default) | uniform (deterministic sampling from seed+count).
randomization:
  banana:
    mode: grid               # grid keeps the historical index order/values
    x_range: [-0.03, 0.10]   # 13 cm span, avoids plate at x=0.22
    y_range: [-0.02, 0.10]   # 12 cm span, 20-32 cm from robot base (y=0.30)
    z_spawn: 0.05             # drops under gravity
    grid_cols: 5              # x divisions
    grid_rows: 7              # y divisions  →  35 positions × 6 yaw = 210 placements
    yaw_steps: 6              # 0°, 60°, 120°, 180°, 240°, 300°
    # uniform mode instead:
    #   mode: uniform
    #   seed: 42              # same seed+count → same sequence on both platforms
    #   count: 50
  arm_joint_names: ["1", "2", "3", "4", "5", "6"]     # from so101.xml
  arm_rest_qpos: [0.0, -1.5854, 1.5708, 0.7854, 0.0, 0.0]  # ResetWorld joint override target
