# speech_direction 平台差异覆盖。
# 公共算法、阵列、门控、时序和诊断参数只维护在 speech_direction.yaml。
profiles:
  ascend_310p:
    silero_vad_backend: "ascend"
    silero_vad_deployment: "ascend_310p"
    fullsubnet_backend: "ascend"
