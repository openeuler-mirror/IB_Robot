speech_direction_node:
  ros__parameters:
    # 以下值是独立启动时的默认值；由 robot_config 启动时，音频参数由机器人 SSOT 覆盖。
    audio_topic: "/audio/capture_stamped"
    audio_channels: 6
    sample_rate: 16000
    channel_indices: [1, 2, 3, 4]
    # FullSubNet/VAD remain continuous; SRP-PHAT updates every two model hops (64 ms).
    srp_update_interval_hops: 2
    early_direction_min_scores: 2
    raw_activity_gate_enabled: true
    raw_activity_start_rms: 0.026
    raw_activity_stop_rms: 0.020
    raw_activity_tail_sec: 0.5

    # 阵列安装偏角和四麦二维坐标；ROS 2 参数使用一维浮点数组。
    mount_yaw_deg: 0.0
    # SRP-PHAT 扫描角度步长(度)。生成 0~360 的候选角度序列并预计算导向相位矩阵，
    # 最终 DOA 只能为该步长的整数倍。必须为 360 的正整数约数(1/2/3/4/5/6/8/9/10/...)。
    # 默认 5(对应回归基线 max err ~15°)。可调更细(如 1/2)，但 4 麦小阵列的物理角度
    # 分辨率有限(空间谱主瓣宽，相邻角度 score 接近，argmax 易在主瓣顶部抖动)，
    # 步长小于阵列分辨能力后，输出精度不再随之提升，仅增加计算量与噪声敏感度。
    angle_step_degree: 5
    mic_positions: [
      0.02285, 0.02285,
      -0.02285, 0.02285,
      -0.02285, -0.02285,
      0.02285, -0.02285
    ]

    # FullSubNet/Silero bundle 与 deployment；具体 deployment、backend 和 artifact 由 manifest/profile 决定。
    speech_direction_inference_bundle: "fullsubnet"
    fullsubnet_deployment: "ascend_310p"
    silero_vad_inference_bundle: "silero-vad"
    silero_vad_deployment: "ascend_310p"

    speech_direction_max_age_ms: 1300

    # 高通量离线维测参数；默认关闭避免部署即写盘到磁盘满，现场诊断时显式开启。
    diagnostics_high_throughput_enabled: false
    diagnostics_rollover_seconds: 300
    diagnostics_save_raw6ch: true
    diagnostics_save_enh4ch: true
    diagnostics_save_frame_metrics: true
    diagnostics_save_gray_events: true
    diagnostics_queue_size: 128
    diagnostics_drop_when_full: true
    # FullSubNet STFT/FB/SB/postprocess 分阶段 timing；仅性能分析时开启。
    fullsubnet_timing_enabled: false
