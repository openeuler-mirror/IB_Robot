[pytest]
# Both directories hold real suites: `tests/` covers the runtime, manifest and
# codec surface, `test/` covers the scheduler control plane. Listing only one
# silently drops the other from `colcon test` and from a bare `pytest` run.
testpaths = tests test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# A package-local pytest.ini makes this directory the rootdir, which also
# truncates pytest's upward conftest.py search at this directory: the
# workspace-root conftest.py that allocates the per-process ROS domain never
# loads, and colcon test runs this package's node tests without domain
# isolation. conftest.py in this directory loads that shared logic instead -
# confcutdir is a command-line-only option and cannot be set from an ini.
# A package-local pytest.ini replaces the root config, so the plugin opt-out
# has to be repeated here. See pyproject.toml for why launch_testing is off:
# it converts a module-level skip into a session-wide collection abort.
addopts = -v --tb=short -p no:launch_testing -p no:launch_ros
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
